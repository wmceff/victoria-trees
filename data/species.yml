    Oklahoma, southeast to South Carolina, and west along the Niobrara River to Cherry County,
    Nebraska
  inaturalist_taxon_id: 54854
  description: >-
    Its flowers provide abundant nectar for insects. The seeds are eaten by chipmunks, mice, and
    squirrels. Rabbits and voles eat the bark, sometimes girdling young trees.
