- name: Aesculus hippocastanum
  common_name: Horse-chestnut
  native_region: the Balkans, Southeast Europe
  inaturalist_taxon_id: 84298
  description: >-
    The common name "horse-chestnut" (often unhyphenated) is reported as having originated from the
    erroneous belief that the tree was a kind of chestnut (though in fact only distantly related),
    together with the alleged observation that the fruit or seeds could help panting or coughing
    horses.


    In Germany, horse-chestnuts are often found in beer gardens, particularly in Bavaria. Prior to
    the advent of mechanical refrigeration, brewers would dig cellars for lagering. To further
    protect the cellars from the summer heat, they would plant chestnut trees, which have spreading,
    dense canopies but shallow roots which would not intrude on the caverns. The practice of serving
    beer at these sites evolved into the modern beer garden.
