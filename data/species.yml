  common_name: Jeffrey pine
  native_region: >-
    California, also in the westernmost part of Nevada, southwestern Oregon, and northern Baja
    California
  inaturalist_taxon_id: 48463
  description: >-
    The scent of Pinus jeffreyi is variously described as reminiscent of vanilla, lemon, pineapple,
    violets, apple, and, quite commonly, butterscotch; This scent may be sampled by breaking off a
    shoot or some needles, or by simply smelling the resin's scent in between the plates of the
    bark.


    The exceptional purity of n-heptane distilled from Pinus jeffreyi resin led to n-heptane being
    selected as the zero point on the octane rating scale of petrol. 


    Pinus jeffreyi is closely related to Pinus ponderosa (ponderosa pine) and is similar in
    appearance. One way to distinguish between them is by their cones. Each has barbs at the end of
    the scales. The sharp Pinus jeffreyi cone scale barbs point inward, so the cone feels smooth to
    the palm of one's hand when rubbed down the cone. Pinus ponderosa cone scale barbs point
    outward, so feel sharp and prickly to the palm of one's hands. This gives rise to the memory
    device for distinguishing between them - "gentle Jeffrey and prickly ponderosa".
