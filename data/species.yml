- name: Thuja plicata
  common_name: Western redcedar
  native: true
  native_region: western North America
  sencoten_name: XPȺ¸
  sencoten_url: http://saanich.montler.net/WordList/plants.html#321.
  inaturalist_taxon_id: 48252
  description: >-
    Western redcedar is also known as the giant arborvitae, by comparison with arborvitae for its
    close relative Thuja occidentalis. Arborvitae comes from the Latin for "tree of life";
    coincidentally, indigenous peoples of the West coast also address the species as "long life
    maker". Western redcedar is a member of the cypress family and not a true cedar of the genus
    Cedrus.


    Western red cedar has an extensive history of use by Indigenous peoples. Some northwest coast
    tribes refer to themselves as "people of the redcedar" because of their extensive dependence on
    the tree for basic materials. The wood has been used for constructing housing and totem poles,
    and crafted into many objects, including masks, utensils, boxes, boards, instruments, canoes,
    vessels, houses, and ceremonial objects. Western Red Cedar is also associated with a long
    tradition of curing and cooking fish over the open fire. Roots and bark are used for baskets,
    bowls, ropes, clothing, blankets, and rings.
