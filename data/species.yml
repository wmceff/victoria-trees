    Pinus contorta is a fire-dependent species, requiring wildfires to maintain healthy populations
    of diverse ages. The bark of the lodgepole pine is fairly thin, minimizing the tree's defense to
    fire; however, the heat of fire opens the cones to release the seeds. This allows the species to
    regenerate and maintain its place in the forest habitat.
- name: Pinus coulteri
  common_name: Big-cone pine
  native_region: the coastal mountains of Southern California and northern Baja California (Mexico)
  inaturalist_taxon_id: 67330
  description: >-
    The outstanding characteristic of this tree is the large, spiny cones which are 20–40 cm
    (7.9–15.7 in) long, and weigh 2–5 kg (4.4–11.0 lb) when fresh. Coulter pines produce the largest
    cones of any pine tree species (people are actually advised to wear hardhats when working in
    Coulter pine groves), although the slender cones of the sugar pine are longer. The large size of
    the cones has earned them the nickname "widowmakers" among locals.
