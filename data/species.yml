  order: Pinales
- name: Thuja occidentalis
  common_name: Northern white-cedar
  order: Pinales
  native_region: eastern Canada and the northeastern United States, from Manitoba to Nova Scotia
  inaturalist_taxon_id: 54037
  description: >-
    Northern white-cedar is honoured in Ojibwe culture as Nookomis Giizhik, Grandmother Cedar, and
    is one of the four plants of the medicine wheel. Its foliage is rich in vitamin C, and it is
    believed to be the annedda that the St. Lawrence Iroquoians used to cure Jacques Cartier's crew
    of scurvy in the winter of 1535–36. Its other name, arborvitae, is Latin for "tree of life".
- name: Thuja plicata
  common_name: Western redcedar
  native: true
  native_region: the Pacific Northwest, from southeast Alaska to northern California and inland to the Rockies
  sencoten_name: XPȺ¸
  sencoten_url: http://saanich.montler.net/WordList/plants.html#321.
  inaturalist_taxon_id: 48252
  description: >-
    Western redcedar boughs are used as ceremonial scrubbers (W̱SÁNEĆ), and to sweep a house after a
    death, with their smoke keeping ghosts away (W̱SÁNEĆ, western Washington peoples). The Straits
    Salish laid their first salmon on cedar boughs. Its straight-grained wood builds houses, canoes
    and totem poles, its bark is woven into clothing, mats and rope, and Sechelt women are renowned
    for coiled cedar-root baskets. It is not a true cedar but a member of the cypress family.
  turner_pages: vol. 2, pp. 128, 303, 329
- name: Thujopsis dolabrata
  common_name: Hiba arborvitae
  order: Pinales
  native_region: Japan
  inaturalist_taxon_id: 135553
  description: >-
    Hiba is called asunaro in Japan, popularly read as "tomorrow it will become a hinoki", because
    it looks like a small hinoki cypress. It is commonly planted around temples there, and in
    gardens in Europe and North America.
- name: Tilia americana
  common_name: American basswood
  native_region: eastern North America, from Manitoba and New Brunswick south to the Carolinas and Oklahoma
  inaturalist_taxon_id: 54854
  description: >-
    American basswood's flowers provide abundant nectar for bees and other insects, and its seeds
    are eaten by chipmunks, mice and squirrels.
- name: Tilia cordata
  common_name: Little-leaf linden
  order: Malvales
  native_region: most of Europe, from Britain to the Caucasus and western Siberia
  inaturalist_taxon_id: 132600
  description: >-
    Small-leaved lime was much planted for avenues in 17th- and early 18th-century landscapes, and
    some lime trees in Germany are said to be over 1,000 years old.
- name: Tilia tomentosa
  common_name: Linden
  order: Malvales
  inaturalist_taxon_id: 143800
- name: Torreya californica
  common_name: California nutmeg
  native_region: California's Coast Ranges and Sierra Nevada foothills
  inaturalist_taxon_id: 55193
  description: >-
    California nutmeg is not closely related to true nutmeg. The wood is sometimes used in making Go
    game boards, as a cheaper substitute for the prized kaya (Torreya nucifera) of Japan and
    Southeast Asia.
- name: Trachycarpus fortunei
  common_name: Chinese Windmill Palm
  order: Arecales
  inaturalist_taxon_id: 64323
- name: Tsuga canadensis
  common_name: Eastern Hemlock
  order: Pinales
  inaturalist_taxon_id: 48734
- name: Tsuga heterophylla
  common_name: Western hemlock
  order: Pinales
  native: true
  sencoten_name: ȾKÁ¸IȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#324.
  native_region: >-
    the Pacific Northwest, from southeast Alaska to northern California and inland to Idaho and
    Montana
  inaturalist_taxon_id: 48254
  description: >-
    Western hemlock boughs are used as ritual scrubbers to protect girls at puberty and hunters
    (Kwakwaka’wakw, Hesquiaht, Ditidaht, Makah, Nlaka’pamux), and its branches are set in the sea to
    collect herring spawn. Its inner bark was eaten, and its hard knots were bent into fishhooks.
    The Ditidaht name means "fire goes out", because it burns poorly. Its seedlings grow on rotting
    stumps and logs, and wait for decades in the shade for a gap in the canopy.
  turner_pages: vol. 1, pp. 340, 344, 351; vol. 2, pp. 179, 185, 195, 303
