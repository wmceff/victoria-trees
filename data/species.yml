  sencoten_url: http://saanich.montler.net/WordList/plants.html#325.
  inaturalist_taxon_id: 56034
  description: >-
    Used by First Peoples for bowls and trays, masks, canoe bailers, paddles, firedrills. Cooking &
    smoking. Dye. Bark would be partially harvested for medicinal use, rectangular pieces cut from
    living trees.


    In moist forest areas Alnus rubra will rapidly cover a former burn or clearcut, often preventing
    the establishment of conifers. It is a prolific seed producer, but the small, wind-dispersed
    seeds require an open area of mineral soil to germinate, and so skid trails and other areas
    disturbed by logging or fire are ideal seedbeds.
