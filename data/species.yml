  description: >-
    This deciduous, flowering tree has been used for many purposes by indigenous communities from
    the west coast of British Columbia to California. The wood was used to make harpoons, bow,
    arrows, combs, and needle hooks. The Cowichan people on Vancouver Island made knitting needles
    from the Pacific Dogwood. The Straits Salish used the bark to make dark brown or red dye. The
    bark was also used medicinally to treat skin infections, fevers, digestive issues, to purify the
    blood to strengthen the lungs, and as an antiseptic. In 1956 the Pacific Dogwood was adopted as
    British Columbia’s floral emblem.


    Cornus nuttallii is named after Thomas Nuttall, an English botanist and zoologist who worked in
    North America in the nineteenth century.
