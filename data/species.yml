    Western white pine bark was peeled in sheets from living trees to make baskets and canoes
    (Ktunaxa, Lakes, Secwepemc). It is the state tree of Idaho. White pine blister rust, a fungus
    brought from Europe by accident in 1909, has killed an estimated 90% of the trees west of the
    Cascades.
  turner_pages: vol. 2, p. 184
