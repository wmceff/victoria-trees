- name: Araucaria araucana
  common_name: Monkey puzzle
  native_region: central and southern Chile and western Argentina
  inaturalist_taxon_id: 126404
  description: >-
    Because of the prevalence of similar species in ancient prehistory, it is sometimes called a
    living fossil. It is also the national tree of Chile.


    The origin of the popular English language name "monkey puzzle" derives from its early
    cultivation in Britain in about 1850, when the species was still very rare in gardens and not
    widely known. Sir William Molesworth, the owner of a young specimen at Pencarrow garden near
    Bodmin in Cornwall, was showing it to a group of friends, when one of them – the noted barrister
    and Benthamist Charles Austin – remarked, "It would puzzle a monkey to climb that".


    Its piñones, or seeds, are edible, similar to large pine nuts, and are harvested by indigenous
    peoples in Argentina and Chile.
- name: Arbutus menziesii
  common_name: Arbutus / Pacific madrone
  order: Ericales
  native: true
  native_region: the western coastal areas of North America, from British Columbia to California
  sencoten_name: ḰEḰEYIȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#332.2.
  inaturalist_taxon_id: 51046
  description: >-
    Many mammal and bird species feed off the berries. The berries dry up and have hooked barbs that
    latch onto larger animals for migration.


    Although drought tolerant and relatively fast growing, Arbutus menziesii is currently declining
    throughout most of its range. One likely cause is fire control; under natural conditions, the
    madrona depends on intermittent naturally occurring fires to reduce the conifer overstory.
    Mature trees survive fire, and can regenerate more rapidly after fire than the Douglas firs with
    which they are often associated. They also produce very large numbers of seeds, which sprout
    following fire.


    Indigenous peoples ate the berries raw and cooked, but because the berries have a high tannin
    content and are thus astringent, they more often chewed them or made them into a cider. They
    also used the berries to make necklaces and other decorations, and as bait for fishing. Bark and
    leaves were used to treat stomach aches, cramps, skin ailments, and sore throats. The bark was
    often made into a tea to be drunk for these medicinal purposes. Wood was spared as fuel and for
    any other use by Saanich for spiritual reasons (because of its service to people during the
    Great Flood).
  indigenous_uses: >-
    Indigenous peoples ate the berries raw and cooked, but because the berries have a high tannin
    content and are thus astringent, they more often chewed them or made them into a cider. Native
    Americans also used the berries to make necklaces and other decorations, and as bait for
    fishing. Bark and leaves were used to treat stomach aches, cramps, skin ailments, and sore
    throats. The bark was often made into a tea to be drunk for these medicinal purposes.
