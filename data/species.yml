  inaturalist_taxon_id: 76447
  description: >-
    This deciduous, flowering tree has been used for many purposes by indigenous communities from
    the west coast of British Columbia to California. The wood was used to make harpoons, bow,
    arrows, combs, and needle hooks. The Cowichan people on Vancouver Island made knitting needles
