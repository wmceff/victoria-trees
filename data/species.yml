- name: Betula papyrifera
  common_name: Paper birch
  order: Fagales
  native: true
  inaturalist_taxon_id: 49883
  description: >-
    Indigenous peoples used the bark for baskets, lining cache pits, burials, etc. It would be
    removed from standing, living trees without killing the tree (general, Tsilhqot’in, Ulkatcho
    Dakelth, Dene [Athabaskan], Secwepemc, Okanagan, Ktunaxa)


    Betula papyrifera is a pioneer species, meaning it is often one of the first trees to grow in an
    area after other trees are removed by some sort of disturbance. Typical disturbances colonized
    by paper birch are wildfire, avalanche, or windthrow areas where the wind has blown down all
    trees. When it grows in these pioneer, or early successional, woodlands, it often forms stands
    of trees where it is the only species.
