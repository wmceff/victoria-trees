  description: >-
    Scouler's willow protects the soil and helps return sites to forest cover following
    disturbances. When growing along streams, it helps protect the stream banks from erosion and
    shades the watercourse, thus maintaining cooler water temperatures. The cover provided is
    important for mammals and birds. The flowers provide pollen and nectar to honey bees in early
    spring.


    Straits Salish peoples used bark and stems cut from living plants for cordage and netting which
    would regenerate in following years.


    The Secwepemc people of British Columbia used the wood for smoking fish, drying meat, and
    constructing fishing weirs, the inner bark for lashing, sowing, cordage, and headbands, and
    decoctions of twigs for treating pimples, body odor, and diaper rash.
