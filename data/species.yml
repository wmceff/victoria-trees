# Curated species details, keyed by species name.
# Tree counts are computed by pipeline/build.mjs; don't add them here.

- name: Abies
  common_name: Fir
  order: Pinales
  inaturalist_taxon_id: 63567
  description: This tree has only been identified to genus, not species.
- name: Abies amabilis
  common_name: Pacific silver fir
  native_region: the Pacific Northwest of North America
  inaturalist_taxon_id: 75240
  description: >-
    Pacific silver fir's inner bark was a coastal food. Sheets were cut from living trees, sometimes
    high up the trunk, so that the trees survived (Kwakwaka’wakw, Ts’msyen), and men climbed with
    ropes while women scraped off the edible layer with mussel-shell or iron knives (Kwakwaka’wakw,
    Gitga’at). At Hartley Bay, Gitga’at elder Archie Dundas showed the harvest again in 2004, about
    60 years after it was last done there. Its knots made bentwood halibut hooks (Ditidaht), but
    some Ts’msyen call it "ghost's wood" because it burns like paper. Its species name, amabilis, is
    Latin for "lovely".
  turner_pages: vol. 1, pp. 351, 358; vol. 2, pp. 76, 183, 417
- name: Abies balsamea
  common_name: Balsam fir
  order: Pinales
  native_region: >-
    eastern and central Canada and the northeastern United States, from Alberta to Newfoundland
  inaturalist_taxon_id: 54261
  description: >-
    Balsam fir is the provincial tree of New Brunswick and is known as the most fragrant of
    Christmas trees. Its resin, Canada balsam, was long used to cement lenses in optical instruments
    and to mount specimens on microscope slides.
  wildlife:
    - who: [red squirrels]
      what: eat its seeds
    - who: [crossbills, chickadees]
      what: find food in it
- name: Abies cephalonica
  common_name: Greek fir
  order: Pinales
  native_region: the mountains of southern Greece, including the island of Kefalonia
  inaturalist_taxon_id: 136886
  description: >-
    Greek fir is named after Cephalonia (Kefalonia), the largest of the Ionian Islands. Once an
    important timber tree in Greece, it is now too rare to be of much value, and bark beetles have
    killed many trees in recent hot, dry years. It is one of the first conifers to put out new
    shoots in spring, so late frosts can damage it.
- name: Abies concolor
  common_name: White fir
  order: Pinales
  native_region: >-
    the mountains of the western United States, from Oregon and Colorado south into northern Mexico
  inaturalist_taxon_id: 68087
  description: >-
    White fir's botanical name, concolor, means "all one colour", because its needles are the same
    blue-grey on both sides. David Douglas overlooked it on his Pacific coast expedition of the
    1820s, and it was first collected near Santa Fe, New Mexico, in 1846–47 by Augustus Fendler.
  wildlife:
    - who: [deer]
      what: browse its foliage
- name: Abies firma
  common_name: Momi fir
  order: Pinales
  native_region: central and southern Japan, from the lowlands up to the lower mountains
  inaturalist_taxon_id: 136304
  description: >-
    Momi fir and Nikko fir are the two firs that make up most of Japan's temperate forests, and
    where their altitude ranges overlap they cross to form a hybrid, Abies × umbellata. Outside
    Japan it is planted mostly where summers are hot and humid, as in the southeastern United
    States, where nurseries also graft other firs onto its roots.
- name: Abies grandis
  common_name: Grand fir
  order: Pinales
  native: true
  sencoten_name: SḰEMÍ¸EḴS
  native_region: >-
    the Pacific Northwest, from southern British Columbia to northern California and inland to Idaho
    and Montana
  inaturalist_taxon_id: 63690
  description: >-
    Grand fir pitch, used as a glue, was harvested from the same tree over generations (Coast
    Salish, Kwakwaka’wakw). Its fragrant boughs were burned as incense to protect against illness
    (Ditidaht) and used for purification (Kwakwaka’wakw), and its needles made a hair perfume
    (Nuxalk, Hesquiaht).
  turner_pages: vol. 1, p. 343; vol. 2, pp. 183, 301
  wildlife:
    - who: [pileated woodpeckers]
      what: search it for insects and places to nest
- name: Abies homolepis
  common_name: Nikko fir
  native_region: the mountains of central and southern Japan
  inaturalist_taxon_id: 136321
  description: >-
    Nikko fir's Japanese name, urajiro momi, means "white-backed fir", for the two white bands under
    each needle. It resists air pollution, and is grown in parks and gardens in northern Europe and
    North America.
- name: Abies koreana
  common_name: Korean fir
  order: Pinales
  native_region: the high mountains of South Korea, including Jeju Island
  inaturalist_taxon_id: 136891
  description: >-
    Korean fir, gusang namu in Korean, grows wild in its largest numbers on Hallasan, a mountain on
    Jeju Island. It is a popular garden fir because even young trees only 1–2 m (3–7 ft) tall bear
    many dark purple-blue cones.
- name: Abies lasiocarpa
  common_name: Subalpine Fir
  order: Pinales
  inaturalist_taxon_id: 75241
- name: Abies nordmanniana
  common_name: Nordmann fir
  order: Pinales
  native_region: the mountains south and east of the Black Sea, in Turkey, Georgia and Russia
  inaturalist_taxon_id: 136894
  description: >-
    Nordmann fir honours Alexander von Nordmann, a Finnish zoologist who directed the botanical
    garden in Odessa. It is one of the most important Christmas trees, because its needles are not
    sharp and stay on as the tree dries. Wild trees in Russia's Western Caucasus Reserve have been
    reported at 78–85 m (256–279 ft), the tallest trees in Europe.
- name: Abies numidica
  common_name: Algerian fir
  order: Pinales
  native_region: a small area around Mount Babor, in northern Algeria
  inaturalist_taxon_id: 136895
  description: >-
    Algerian fir grows high on a mountain where most of the year's precipitation falls as winter
    snow and summers are warm and very dry, and it copes with drought better than most firs. It also
    tolerates polluted air, and its closest relative is Spanish fir.
- name: Abies pinsapo
  common_name: Spanish fir
  order: Pinales
  native_region: a few mountain ranges in southern Spain, near Ronda, and northern Morocco
  inaturalist_taxon_id: 136896
  description: >-
    Spanish fir takes its botanical name from its Spanish name, pinsapo. Its short blue-grey needles
    stand out all round the shoot like a bottlebrush, where most firs hold theirs in flat rows.
    Conservation and replanting have greatly increased its numbers, though fire, erosion, building
    and heavy tourism still threaten it.
- name: Abies procera
  common_name: Noble fir
  order: Pinales
  native_region: the mountains of western Washington and Oregon, and far northwestern California
  inaturalist_taxon_id: 75242
  description: >-
    Noble fir was named by David Douglas, who found it in the Cascade Range and sent its seed to
    Britain in 1830. It is the world's tallest true fir. Loggers prized its light, strong wood and
    called it "larch" so it would not be confused with weaker firs, and it may have gone into the
    frames of wartime Mosquito bombers.
- name: Acer
  common_name: Maple
  inaturalist_taxon_id: 48098
  description: This tree has only been identified to genus, not species.
- name: Acer buergerianum
  common_name: Trident maple
  order: Sapindales
  native_region: eastern China and Taiwan
  inaturalist_taxon_id: 337792
  description: >-
    Trident maple, named for its three-lobed leaves, reached Japan from China so long ago that its
    Japanese name means "China maple". It is one of the most popular maples for bonsai, and its
    botanical name honours the 19th-century plant hunter J. Buerger.
- name: Acer campestre
  common_name: Field maple
  order: Sapindales
  native_region: most of Europe, from Britain to Turkey and the Caucasus, and the mountains of North Africa
  inaturalist_taxon_id: 56193
  description: >-
    Field maple is the only maple native to Britain, where it's a common hedgerow tree. Its
    fine-grained wood has long been used for turning and carving.
- name: Acer capillipes
  common_name: Red snakebark maple
  order: Sapindales
  native_region: mountain streamsides in central and southern Japan
  inaturalist_taxon_id: 774116
  description: >-
    Red snakebark maple has smooth olive-green bark with narrow white stripes, a pattern it keeps to
    the base of the trunk even when old, and small rust-orange spots on the bark set it apart from
    its relatives. Its leaf stalks are red, and its leaves turn yellow, orange or red in autumn.
- name: Acer cappadocicum
  common_name: Cappadocian maple
  order: Sapindales
  native_region: Asia, from Turkey through the Caucasus and the Himalayas to southwestern China
  inaturalist_taxon_id: 399309
  description: >-
    Cappadocian maple is named after Cappadocia, the ancient name for a region of central Turkey.
    Its leaf stalks bleed a milky sap when snapped, and garden trees often send up many suckers from
    their roots, which is rare in maples.
- name: Acer circinatum
  common_name: Vine maple
  order: Sapindales
  native: true
  sencoten_name: PENÁEȽĆ
  native_region: >-
    the Pacific coast of North America, from southern British Columbia to northern California
  inaturalist_taxon_id: 48258
  description: >-
    Coastal peoples valued vine maple's wood for bows, arrow shafts, dip-net hoops, snowshoe frames,
    spoons and tool handles, and wove its thin stems into baskets. Branches were cut from living
    plants rather than felling them (mainland Halkomelem, Lower Stl’atl’imx and others), and wood
    for bows was traded from the coast to the BC interior. Its flexible branches can bend to the
    ground and take root, forming arches and spreading stands under the forest canopy.
  turner_pages: vol. 1, pp. 364–366, 368; vol. 2, pp. 122, 185
  wildlife:
    - who: [chickadees, nuthatches, grosbeaks, woodpeckers]
      what: eat its winged seeds
- name: Acer crataegifolium
  common_name: Hawthorn maple
  order: Sapindales
  native_region: the mountain forests of central and southern Japan
  description: >-
    Hawthorn maple's Japanese name, urikaede, means "melon maple", for its green bark with pale
    stripes like a melon's skin. Its botanical name means "hawthorn-leaved", a likeness that holds
    only for certain hawthorns. Charles Maries of the Veitch nursery brought it to England in 1879,
    but it is hard to propagate and seldom grown.
- name: Acer freemanii
  common_name: Freeman maple
  order: Sapindales
  native_region: eastern North America, where red and silver maples grow wild together
  description: >-
    Freeman maple is named after Oliver Freeman of the U.S. National Arboretum, who crossed red and
    silver maples deliberately in 1933; the same cross also happens in the wild. Nursery selections
    grow faster than red maple and have stronger branches than silver maple, turn orange-red in
    autumn, and are usually seedless, so they drop few winged seeds.
- name: Acer ginnala
  common_name: Amur maple
  native_region: 'northeast Asia: Mongolia, northern China, Korea, Japan and the Russian Far East'
  inaturalist_taxon_id: 123638
  description: >-
    Amur maple turns brilliant orange to red in autumn, with reddish winged seeds. It has become
    invasive in parts of northern North America.
- name: Acer glabrum
  common_name: Douglas maple
  order: Sapindales
  native_region: western North America, from southeast Alaska to California and New Mexico
  inaturalist_taxon_id: 63078
  description: >-
    Douglas maple, the coastal form of Rocky Mountain maple, has a Ditidaht name meaning "drinking
    bowl plant". Its dense wood made snowshoe frames, bows, labrets (lip ornaments) and dishes, and
    its tough inner bark was woven into mats, baskets and trays (coastal and interior peoples); bark
    and branches were taken from living plants (Interior Plateau). In the Ts’msyen story "The Boy
    Taken by the Star", people burned every kind of wood to find the one that lasts longest, and it
    was this maple, still known as a long-lasting fuel. The Ts’msyen also traded its wood to the
    Haida.
  turner_pages: vol. 1, pp. 130, 341–342, 346–347, 365, 379, 400; vol. 2, pp. 122, 185
  wildlife:
    - who: [deer]
      what: browse its foliage, especially in winter
- name: Acer griseum
  common_name: Paperbark maple
  order: Sapindales
  native_region: the mountains of central China
  inaturalist_taxon_id: 120525
  description: >-
    Paperbark maple was brought from central China in 1901 by the plant hunter Ernest Wilson,
    collecting for the Veitch nursery in England. Its orange-red bark peels in thin, translucent
    curls that cling to the branches. Many of its seeds are empty, so it is hard to raise, and in
    2015 an expedition went to China to collect wild seed to widen the gene pool of garden trees.
- name: Acer henryi
  common_name: Henry's maple
  order: Sapindales
  native_region: central and eastern China
  inaturalist_taxon_id: 707456
  description: >-
    Henry's maple is named after Augustine Henry, an Irish plant collector who worked in China in
    the late 1800s. Unlike most maples, its leaves are divided into three separate leaflets, whitish
    underneath, and male and female flowers grow on separate trees.
- name: Acer japonicum
  common_name: Fullmoon maple
  order: Sapindales
  native_region: Japan and southern Korea
  inaturalist_taxon_id: 63510
  description: >-
    Fullmoon maple has almost round leaves cut into 9 to 13 lobes, while the common Japanese maple
    rarely has more than seven. Its small dark purplish-red flowers hang in clusters as the leaves
    open, and in autumn the leaves turn bright orange to deep red.
- name: Acer macrophyllum
  common_name: Bigleaf maple
  order: Sapindales
  native: true
  native_region: the Pacific coast of North America, from southern Alaska to southern California
  sencoten_name: ȾŦÁ¸EȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#329.
  inaturalist_taxon_id: 48227
  description: >-
    Bigleaf maple is called "paddle tree" in at least six Coast Salish languages, because its wood
    is prime for carving paddles. Coast Salish peoples took its bark and wood from living trees for
    weaving, paddles, spindle whorls, other tools and fuel, and red elderberries were wrapped in its
    big leaves and buried in sand to store them (Lushootseed). Its wood also made bowls, dishes and
    masks.
  turner_pages: vol. 1, pp. 296, 341, 347; vol. 2, p. 185
  wildlife:
    - who: [grosbeaks]
      what: eat its winged seeds in winter
- name: Acer miyabei
  common_name: Miyabe maple
  order: Sapindales
  native_region: scattered streamsides in northern Japan, on Hokkaido and northern Honshu
  inaturalist_taxon_id: 48074
  description: >-
    Miyabe maple is endangered in the wild. It is named after Kingo Miyabe, a botanist in Hokkaido,
    and its closest relatives include field maple from Europe.
- name: Acer negundo
  common_name: Manitoba maple
  order: Sapindales
  native_region: much of North America, from the Canadian Prairies south to Central America
  inaturalist_taxon_id: 47726
  description: >-
    Manitoba maple's other name, box elder, comes from its pale wood, like boxwood, and its leaves,
    divided into three to seven leaflets like an elder's; no other maple regularly has more than
    three. The oldest surviving wooden flutes in the Americas, found in northeastern Arizona and
    dated to about 620–670 CE, are made of box elder.
  wildlife:
    - who: [evening grosbeaks]
      what: eat its seeds
- name: Acer palmatum
  common_name: Japanese maple
  order: Sapindales
  native_region: Japan, Korea, eastern China and southeast Russia
  inaturalist_taxon_id: 63512
  description: >-
    Japanese maple, momiji in Japanese, has been grown in Japan for centuries and in gardens around
    the world since the 1800s, with hundreds of cultivars chosen for their leaf shapes and colours.
- name: Acer platanoides
  common_name: Norway maple
  order: Sapindales
  native_region: Europe and western Asia, from France and Scandinavia east to Russia and northern Iran
  inaturalist_taxon_id: 54763
  cultivars:
    - name: Crimson King
      description: A Norway maple whose leaves stay deep maroon all summer.
  description: >-
    Norway maple was brought to North America in the mid-1700s as a shade tree, and became one of the
    most planted street trees of the 20th century. Its dense shade and many seedlings now make it an
    invasive species in many North American forests. A broken leaf stalk oozes milky sap, which tells
    it apart from sugar maple.
- name: Acer pseudoplatanus
  common_name: Sycamore maple
  order: Sapindales
  native_region: central Europe and western Asia, from France east to Ukraine, Turkey and the Caucasus
  inaturalist_taxon_id: 119791
  cultivars:
    - name: Spaethii
      description: A sycamore maple whose leaves are dark green above and purple underneath.
  description: >-
    Sycamore maple tolerates wind and salt spray, which made it a common tree on coasts and in exposed
    places in Britain, where it's simply called sycamore. Its winged seeds twirl to the ground in
    pairs and sprout freely, so it can spread into nearby woods.
- name: Acer rubrum
  common_name: Red maple
  order: Sapindales
  native_region: eastern North America, from Manitoba and Newfoundland south to Florida and Texas
  inaturalist_taxon_id: 48098
  cultivars:
    - name: Armstrong
      description: >-
        A very narrow, columnar red maple selected in Ohio in the 1940s. It's often treated as a
        hybrid with silver maple (Acer × freemanii).
    - name: Sun Valley
      description: >-
        A seedless red maple from the U.S. National Arboretum, with a dense oval crown and bright red
        autumn colour.
    - name: Columnare
      match: columnar
      description: An upright, narrow form of red maple, used along streets where space is tight.
    - name: Bowhall
      description: An upright, narrowly oval red maple with orange-red autumn colour.
    - name: October Glory
      description: >-
        A red maple with a rounded crown that colours late, holding its red-orange leaves well into
        autumn.
    - name: Karpick
      description: A narrow red maple with red twigs. It's a male tree, so it doesn't drop seeds.
    - name: Autumn Blaze
      match: autumn blaze
      description: >-
        A fast-growing hybrid of red and silver maple (Acer × freemanii 'Jeffersred'), with orange-red
        autumn colour.
    - name: Red Sunset
      description: One of the most planted red maples in North America, colouring early to a bright orange-red.
  description: >-
    Red maple is one of the most common and widespread trees of eastern North America, growing
    everywhere from swamps to dry ridges. Its flowers, leaf stalks, twigs and seeds are all red to
    some degree, and it's widely planted for its red autumn colour.
- name: Acer rufinerve
  common_name: Redvein maple
  order: Sapindales
  native_region: the mountain forests of Japan
  inaturalist_taxon_id: 447110
  description: >-
    Redvein maple is named for the rusty down on the veins of its young leaves, which is also what
    its botanical name, rufinerve, means. Its Japanese name, urihadakaede, means "melon-skin maple",
    for its green bark with pale stripes. It is one of the most widely planted snakebark maples, and
    turns bright orange or red in autumn.
- name: Acer saccharinum
  common_name: Silver maple
  order: Sapindales
  native_region: the eastern and central United States and southeastern Canada
  inaturalist_taxon_id: 54762
  description: >-
    Silver maple's leaves have downy, silvery undersides that flash in the lightest breeze on their
    long, slender stalks. After the Second World War it was widely planted to replace American elms
    killed by disease, but its brittle wood, invasive roots and many seedlings have led some towns
    to ban it as a street tree.
  wildlife:
    - who: [squirrels]
      what: eat its large buds in spring
    - who: [raccoons, owls, woodpeckers]
      what: shelter in cavities in its trunk
- name: Acer saccharum
  common_name: Sugar maple
  order: Sapindales
  native_region: the hardwood forests of eastern Canada and the eastern United States
  inaturalist_taxon_id: 52543
  description: >-
    Sugar maple, with its close relative black maple, is the main source of maple syrup; about 40
    litres of sap are boiled down for each litre of syrup. A stylized 11-pointed sugar maple leaf is
    on the flag of Canada, and it is the state tree of New York, Vermont, West Virginia and
    Wisconsin.
  cultivars:
    - name: Green Mountain
      description: A sugar maple selected for heat and drought tolerance, with orange-red autumn colour.
- name: Acer tegmentosum
  common_name: Manchurian striped maple
  order: Sapindales
  native_region: the Russian Far East, northeastern China and Korea
  inaturalist_taxon_id: 496247
  description: >-
    Manchurian striped maple has greenish-grey bark with bright white stripes, and its leaves turn
    bright yellow in autumn. It survives winters as cold as about −29 °C (−20 °F). It is not
    generally considered at risk, but China's 2004 red list of species classed it as vulnerable.
- name: Acer truncatum
  common_name: Shantung maple
  order: Sapindales
  native_region: northern China and Korea
  inaturalist_taxon_id: 461754
  description: >-
    Shantung maple is named after Shandong, the province of northern China once spelled Shantung.
    Almost all of the City's trees are Sunset hybrids with Norway maple, bred at J. Frank Schmidt &
    Son, an Oregon nursery, as tough street trees.
  cultivars:
    - name: Pacific Sunset
      description: >-
        A hybrid of Shantung maple and Norway maple from J. Frank Schmidt & Son, with glossy leaves
        and early yellow-orange to red autumn colour.
    - name: Urban Sunset
      description: An upright hybrid of Shantung maple and Norway maple, bred as a tough street tree.
    - name: Crimson Sunset
      description: >-
        A hybrid of Shantung maple and the purple Norway maple 'Crimson King', with deep purple leaves
        through summer.
- name: Aesculus
  common_name: Horse Chestnut
  order: Sapindales
  inaturalist_taxon_id: 84298
  description: This tree has only been identified to genus, not species.
- name: Aesculus × carnea
  common_name: Red horse-chestnut
  garden_origin: >-
    a hybrid of the European horse-chestnut and the American red buckeye, which probably first
    appeared in Germany in the early 1800s
  inaturalist_taxon_id: 478638
  description: >-
    Unusually for a hybrid, red horse-chestnut breeds true from seed: its chromosomes doubled, so
    its seedlings look like the parent tree.
  cultivars:
    - name: Fort McNair
      description: >-
        A pink-flowered red horse-chestnut named after Fort McNair in Washington, D.C., more resistant
        to leaf blotch than most.
    - name: Briotii
      match: briot
      description: >-
        The most commonly planted red horse-chestnut, with brighter red flowers on a smaller tree.
        It was named in 1858 after Pierre Louis Briot, chief gardener of the state gardens at
        Trianon-Versailles, near Paris.
- name: Aesculus carnea
  common_name: Horse chestnut
  inaturalist_taxon_id: 478638
- name: Aesculus hippocastanum
  common_name: Horse-chestnut
  native_region: the mountains of the Balkans, in Greece, Albania and North Macedonia
  inaturalist_taxon_id: 84298
  description: >-
    Horse-chestnut isn't a true chestnut; the name may come from a belief that its seeds, conkers,
    could cure coughing horses. In Bavaria, brewers planted horse-chestnuts over their beer cellars
    to keep them cool, and the custom of serving beer under them grew into the beer garden.
  cultivars:
    - name: Baumannii
      match: baumn
      description: >-
        A double white-flowered horse-chestnut found near Geneva around 1820 by A. N. Baumann. Its
        flowers are sterile, so it drops no conkers, which makes it a favourite for streets.
- name: Aesculus indica
  common_name: Indian horse-chestnut
  native_region: the western Himalayas, from Kashmir to western Nepal
  inaturalist_taxon_id: 367294
  description: >-
    Indian horse-chestnut seeds are dried and ground into a bitter flour, tattawakher, which is
    washed to remove the bitter saponins and then mixed with wheat flour for chapatis, or cooked as
    halwa or a porridge eaten during fasts. Collecting the seeds for flour seems to have reduced the
    tree in the wild.
  wildlife:
    - who: [bees]
      what: pollinate its flowers
- name: Ailanthus altissima
  common_name: Tree of heaven
  native_region: northern and central China, and Taiwan
  inaturalist_taxon_id: 57278
  description: >-
    Tree of heaven appears in the oldest surviving Chinese dictionary and in many Chinese medical
    texts. It is now one of the worst invasive trees in Europe and North America, growing up to 15 m
    (50 ft) in 25 years, and it feeds the invasive spotted lanternfly.
- name: Albizia julibrissin
  common_name: Mimosa Or Silk Tree
  order: Fabales
  inaturalist_taxon_id: 47443
- name: Alnus rubra
  common_name: Red alder
  order: Fagales
  native: true
  sencoten_name: SḰOṈEȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#325.
  native_region: the Pacific coast of North America, from southeast Alaska to California
  inaturalist_taxon_id: 56034
  description: >-
    Red alder's inner bark was eaten (W̱SÁNEĆ), and its wood and bark, taken from living trees, gave
    fuel, tools and dye, with its limbs and saplings used for fish weirs (Straits Salish,
    Kwakwaka’wakw and other coastal peoples). Its soft wood was carved into bowls, trays, masks and
    paddles, and burned for cooking and smoking. It is one of the first trees to cover burned or
    logged ground.
  turner_pages: vol. 1, pp. 62, 341; vol. 2, p. 185
  wildlife:
    - who: [pine siskins]
      what: eat its seeds
- name: Amelanchier × grandiflora
  common_name: Apple serviceberry
  garden_origin: >-
    a garden hybrid of downy and Allegheny serviceberries, both from eastern North America
  inaturalist_taxon_id: 363450
  description: >-
    The name grandiflora means "large-flowered", and this hybrid serviceberry's white blossoms are
    followed by small, edible red to purple fruit. Its parents cross so readily that serviceberries
    are hard to tell apart and are often mislabelled in nurseries. Its named selections include
    'Autumn Brilliance', 'Princess Diana' and 'Robin Hill'.
  bloom:
    from: early April
    to: late April
    colour: white
    hue: white
- name: Amelanchier arborea
  common_name: Downy serviceberry
  order: Rosales
  native_region: eastern North America, from Ontario and Quebec south to the Gulf of Mexico
  inaturalist_taxon_id: 49226
  description: >-
    Downy serviceberry has a string of folk names. Shadberry comes from its flowering during the
    shad runs in New England, and serviceberry, or sarviceberry, is said to come from Appalachia,
    where its blossoms meant the muddy roads would soon be open to travelling preachers and church
    services could begin again.
  wildlife:
    - who: [bees]
      what: pollinate its flowers
    - who: [squirrels, rabbits, deer]
      what: eat its fruit
  bloom:
    from: early April
    to: late April
    colour: white
    hue: white
  cultivars:
    - name: Autumn Brilliance
      description: >-
        A serviceberry (usually listed as Amelanchier × grandiflora) with white flowers in spring and
        bright orange-red autumn colour.
- name: Amelanchier canadensis
  common_name: Shadbush
  order: Rosales
  native_region: eastern North America, from Newfoundland to Alabama, mostly near the Atlantic coast
  inaturalist_taxon_id: 133382
  description: >-
    Shadbush has many folk names, among them juneberry, sugarplum and currant-tree, and its small
    dark purple fruit is sweet and edible. Its hard, heavy wood takes a polish and has been used for
    fishing rods, walking sticks and handles. It is listed as vulnerable in the Canadian provinces
    where it grows wild.
  wildlife:
    - who: [robins, woodpeckers, squirrels]
      what: eat its fruit
    - who: [bees, butterflies]
      what: feed at its early spring flowers
- name: Amelanchier grandiflora
  common_name: Shadbush
  inaturalist_taxon_id: 363450
- name: Araucaria araucana
  common_name: Monkey puzzle
  native_region: the Andes of central Chile and western Argentina
  inaturalist_taxon_id: 126404
  description: >-
    Monkey puzzle is the national tree of Chile, and its name araucana comes from the Araucanian
    (Mapuche) people, who harvest its large edible seeds, piñones. The English name dates from about
    1850 in Cornwall, when a visitor admiring a young tree said, "It would puzzle a monkey to climb
    that." It is now endangered in the wild.
- name: Arbutus menziesii
  common_name: Arbutus / Pacific madrone
  order: Ericales
  native: true
  native_region: the Pacific coast of North America, from British Columbia to California
  sencoten_name: ḰEḰEYIȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#332.2.
  inaturalist_taxon_id: 51046
  description: >-
    The W̱SÁNEĆ (Saanich) spare arbutus from use as firewood or for anything else, for spiritual
    reasons: during the Great Flood it served the people as an anchor. Its leaves and bark are taken
    from living trees for medicine (Straits Salish), and its Squamish name means "peeling tree".
  turner_pages: vol. 1, p. 129; vol. 2, pp. 185, 269
  wildlife:
    - who: [robins, cedar waxwings, varied thrushes, band-tailed pigeons, juncos, quail]
      what: eat its berries
    - who: [woodpeckers, other cavity-nesting birds]
      what: favour it for nesting
- name: Arbutus unedo
  common_name: Strawberry tree
  order: Ericales
  native_region: the Mediterranean and western Europe, as far north as Ireland
  inaturalist_taxon_id: 82689
  description: >-
    Strawberry tree is the national tree of Italy, because its green leaves, white flowers and red
    fruit, which hang on the tree together in autumn, recall the Italian flag. Its species name,
    unedo, is credited to Pliny the Elder, who is said to have remarked "unum tantum edo", "I eat
    only one".
  wildlife:
    - who: [bees]
      what: feed on the nectar and pollen of its flowers
- name: Asimina triloba
  common_name: Pawpaw
  native_region: eastern North America, from southern Ontario to northern Florida and eastern Texas
  description: >-
    Pawpaw is the northernmost member of the custard-apple family, a mostly tropical family that
    includes cherimoya and soursop, and its sweet fruit has a custard-like texture and a taste like
    banana or pineapple. Its large seeds were probably spread by mastodons, mammoths and giant
    ground sloths until they died out.
- name: Austrocedrus chilensis
  common_name: Chilean cedar
  native_region: the Andes of central and southern Chile and western Argentina
  inaturalist_taxon_id: 136243
  description: >-
    Chilean cedar is the only living species of Austrocedrus, "southern cedar", though in Chile and
    Argentina it is called a cypress, ciprés de la cordillera. A second, extinct species of the
    genus is known from Late Cretaceous fossils in Antarctica.
- name: Betula
  common_name: Birch
  order: Fagales
  inaturalist_taxon_id: 49883
  description: This tree has only been identified to genus, not species.
- name: Betula alba
  common_name: Downy birch
  order: Fagales
  native_region: northern and central Europe and Asia, from Iceland and Britain to Siberia
  inaturalist_taxon_id: 119061
  description: >-
    The old name Betula alba covered both silver birch and downy birch, the two white-barked birches
    of northern Europe. Downy birch grows farther north than any other broadleaf tree; its outer
    bark peels off without killing the tree and has been made into canoe skins, cups and roof tiles,
    and the Sami of Scandinavia ground the reddish inner bark into bread flour.
- name: Betula nigra
  common_name: Black birch
  native_region: >-
    the eastern United States, from New Hampshire to Minnesota and south to Florida and Texas
  inaturalist_taxon_id: 117429
  description: >-
    River birch, also called black birch, grows wild along stream banks and is one of the few
    birches that thrive in summer heat; its saplings can survive a month of flooding. Native
    Americans boiled its sap into a sweetener like maple syrup.
  cultivars:
    - name: Dura Heat
      description: A compact river birch selected for heat and drought tolerance, with peeling creamy-white bark.
    - name: Heritage
      description: The best-known river birch cultivar, with peeling bark in salmon, tan and cream.
- name: Betula papyrifera
  common_name: Paper birch
  order: Fagales
  native: true
  native_region: northern North America, across Canada, Alaska and the northern United States
  inaturalist_taxon_id: 49883
  description: >-
    Paper birch bark was peeled from living trees, without killing them, for baskets, for lining
    food cache pits and for burials (Tsilhqot’in, Ulkatcho Dakelh, Dene, Secwepemc, Okanagan,
    Ktunaxa). Its Squamish name, qwéłiʔn, comes from an ancient Salishan word for birch. It is a
    pioneer tree, often the first to grow back after fire, avalanches or windthrow.
  turner_pages: vol. 1, p. 185; vol. 2, p. 186
  wildlife:
    - who: [chickadees]
      what: eat its seeds
- name: Betula pendula
  common_name: Silver birch
  order: Fagales
  native_region: Europe and northern Asia, from Ireland to Siberia
  inaturalist_taxon_id: 83992
  description: >-
    Silver birch is named for its white bark, which peels away in papery strips, and is also called
    weeping birch for its hanging branch tips. It's the national tree of Finland, and has become
    invasive in parts of North America.
- name: Betula populifolia
  common_name: Grey birch
  native_region: northeastern North America, from southern Quebec and Nova Scotia to New Jersey
  inaturalist_taxon_id: 49884
  description: >-
    Grey birch's botanical name, populifolia, means "poplar-leaved", for the way its leaves flutter
    in the wind like a poplar's. It is often mistaken for paper birch, but its chalky white bark
    doesn't peel as readily and has black triangular patches at the base of each branch. The
    Iroquois and Mi'kmaq used its inner bark to treat infected cuts and wounds.
  wildlife:
    - who: [juncos, chickadees]
      what: eat its seeds
- name: Broadleaf Deciduous
  common_name: Broadleaf Deciduous Medium
- name: Broadleaf Evergreen
  common_name: Broadleaf Evergreen Medium
- name: Buxus
  common_name: Boxwood
  order: Buxales
  inaturalist_taxon_id: 133397
  description: This tree has only been identified to genus, not species.
- name: Calocedrus decurrens
  common_name: Incense cedar
  native_region: southwestern Oregon, California and northern Baja California, in Mexico
  inaturalist_taxon_id: 53723
  description: >-
    Incense cedar was once the main wood for pencils, being soft and sharpening without splinters,
    and its fragrant wood has been used for moth-resistant chests. Indigenous peoples of California
    use it for medicine, basket-making, hunting bows and building, and to start fires by friction.
- name: Camelia spp
  common_name: Camelia
  description: This tree has only been identified to genus, not species.
- name: Carpinus
  common_name: Hornbeam
  order: Fagales
  inaturalist_taxon_id: 54768
  description: This tree has only been identified to genus, not species.
- name: Carpinus betulus
  common_name: European hornbeam
  order: Fagales
  native_region: Europe and western Asia, from southern England and France to Ukraine, Turkey and Iran
  inaturalist_taxon_id: 55801
  cultivars:
    - name: Fastigiata
      description: >-
        An upright form of European hornbeam, narrow when young and widening into a flame shape with
        age. A popular street tree for its tidy crown.
  description: >-
    European hornbeam has some of the hardest wood of any European tree, once used for ox yokes
    (giving it the old name yoke elm), butchers' blocks, mallets and piano hammers. It takes clipping
    well, and is a traditional hedging tree in European gardens.
- name: Carpinus caroliniana
  common_name: American hornbeam
  order: Fagales
  native_region: eastern North America, from southern Quebec and Minnesota to Texas and Florida
  inaturalist_taxon_id: 54768
  description: >-
    American hornbeam, or blue-beech, is also known as musclewood for its smooth, grey-green trunk,
    which ripples with sinewy ridges like flexed muscle. Its hard, heavy wood has been made into
    tool handles, levers, walking sticks, longbows and golf clubs.
- name: Carya
  common_name: Carya
  order: Fagales
  inaturalist_taxon_id: 54791
  description: This tree has only been identified to genus, not species.
- name: Castanea dentata
  common_name: American Chestnut
  order: Fagales
  inaturalist_taxon_id: 49186
- name: Castanea mollissima
  common_name: Chinese chestnut
  order: Fagales
  native_region: China, Taiwan and Korea
  inaturalist_taxon_id: 49192
  description: >-
    Chinese chestnut evolved alongside chestnut blight and resists it better than any other
    chestnut. Asian chestnuts imported to the United States in the 1890s brought the blight with
    them, and within 30 years it had nearly wiped out the American chestnut; breeders now cross the
    two species to carry Chinese resistance into American trees.
- name: Castanea sativa
  common_name: Sweet chestnut
  native_region: southern Europe and Turkey, around the Mediterranean and Black Sea
  inaturalist_taxon_id: 121763
  description: >-
    Sweet chestnut's nuts have been eaten since ancient times: carbonised chestnuts were found in a
    Roman villa near Naples buried by Vesuvius in AD 79. An ancient tree on Mount Etna in Sicily,
    the Hundred Horse Chestnut, was once recorded at 18 m (59 ft) around its split trunks.
- name: Catalpa bignonioides
  common_name: Southern catalpa
  order: Lamiales
  native_region: the southeastern United States, from Louisiana to Georgia and Florida
  inaturalist_taxon_id: 50859
  description: >-
    Southern catalpa was first seen by Europeans growing in Cherokee fields. Also called cigar tree
    and Indian bean tree, it has long, thin pods, 20–40 cm (8–16 in), that often hang on through
    winter. Its leaves, unusually, secrete nectar, making extra when caterpillars feed on them,
    which draws ants that guard the tree.
- name: Catalpa speciosa
  common_name: Northern catalpa
  order: Lamiales
  native_region: the midwestern United States, around where the Ohio River meets the Mississippi
  inaturalist_taxon_id: 76158
  description: >-
    Northern catalpa is also called worm tree or bait tree: anglers prize the caterpillars of the
    catalpa moth that feed on its leaves, and some trees are planted just to raise them. Its wood
    resists rot, and farmers once planted it widely in Ohio to grow fence posts.
- name: Ceanothus
  common_name: California Lilac
  order: Rosales
  inaturalist_taxon_id: 56617
  description: This tree has only been identified to genus, not species.
- name: Cedrus atlantica
  common_name: Atlas cedar
  native_region: the Atlas Mountains of Morocco and Algeria, in North Africa
  inaturalist_taxon_id: 136234
  description: >-
    Atlas cedar forests in Morocco and Algeria are home to the endangered Barbary macaque. Most
    planted trees are blue-needled forms, known as the Glauca group.
- name: Cedrus brevifolia
  common_name: Cyprus cedar
  order: Pinales
  native_region: just five natural stands in the Troödos Mountains of Cyprus
  notable: true
  inaturalist_taxon_id: 136296
  description: >-
    Cyprus cedar is listed as vulnerable, and its largest wild stand, at Tripylos in the Cedar
    Valley of Paphos Forest, holds about 16,000 mature trees. Botanists disagree over whether it is
    a species of its own or a variety of the cedar of Lebanon; brevifolia means "short-leaved".
- name: Cedrus deodara
  common_name: Deodar cedar
  order: Pinales
  native_region: the western Himalayas, in Afghanistan, Pakistan, India, Tibet and Nepal
  inaturalist_taxon_id: 69820
  description: >-
    The name deodar comes from the Sanskrit devadāru, "wood of the gods", from deva, "god", and
    dāru, "wood". Hindus revere it as a divine tree.
- name: Cedrus libani
  common_name: Cedar of Lebanon
  order: Pinales
  native_region: the mountains of Lebanon, Syria and southern Turkey
  inaturalist_taxon_id: 136234
  description: >-
    Cedar of Lebanon is the national emblem of Lebanon. The ancient Phoenicians built ships from it
    and traded it across the Mediterranean, and a tree planted at Childrey in England in 1646 is the
    oldest in Britain.
- name: Celtis occidentalis
  common_name: Common hackberry
  order: Rosales
  native_region: >-
    central and eastern North America, from southern Ontario to North Carolina and Oklahoma
  inaturalist_taxon_id: 54857
  description: >-
    Common hackberry is easy to recognize by its bark, broken into corky, wart-like ridges that look
    like layers of rock seen edge-on. Its pea-sized berries ripen orange-red to dark purple and
    often hang on the tree for months. Montreal has more than 10,000 as street trees.
  wildlife:
    - who: [robins, cedar waxwings]
      what: eat its berries
- name: Celtis sinensis
  common_name: Japanese hackberry
  order: Rosales
  native_region: China, Korea, Japan and Taiwan
  inaturalist_taxon_id: 76204
  description: >-
    Japanese hackberry is a tree of classical East Asian garden design, and its leaves and bark are
    used in Korean traditional medicine. In eastern Australia it is a declared noxious weed, its
    seeds spread by birds, fruit bats and water.
- name: Cercidiphyllum japonicum
  common_name: Katsura
  order: Saxifragales
  native_region: Japan and China
  inaturalist_taxon_id: 133356
  description: >-
    The Katsura tree is sometimes called caramel tree for the light caramel smell it emits during
    leaf fall.
- name: Cercis canadensis
  common_name: Eastern redbud
  order: Fabales
  native_region: eastern North America, from southern Michigan to central Mexico
  inaturalist_taxon_id: 48502
  description: >-
    Eastern redbud is the state tree of Oklahoma, and Columbus, Wisconsin, calls itself the "Redbud
    City". Its magenta-pink flowers open on bare twigs and sometimes straight from the trunk. In
    southern Appalachia its green twigs are used to season venison, which has earned it the name
    spicewood tree.
- name: Chamaecyparis
  order: Pinales
  inaturalist_taxon_id: 76237
  description: This tree has only been identified to genus, not species.
- name: Chamaecyparis lawsoniana
  common_name: Lawson cypress
  order: Pinales
  native_region: a small area of southwest Oregon and northwest California
  inaturalist_taxon_id: 76237
  description: >-
    In its home range it's called Port Orford cedar. Its fragrant, rot-resistant wood has been
    exported in large amounts to Japan for coffins, shrines and temples, and is a favourite for
    arrow shafts. Wild trees are now threatened by an introduced root rot.
- name: Chamaecyparis obtusa
  common_name: Hinoki cypress
  order: Pinales
  native_region: central and southern Japan
  inaturalist_taxon_id: 133369
  description: >-
    Hinoki is one of Japan's most prized timbers: Hōryū-ji temple and Osaka Castle are built from
    it, and the hinoki of the Kiso valley used for Ise Shrine are called "divine trees". It is also
    used for noh theatres, baths and table tennis blades.
- name: Chamaecyparis pisifera
  common_name: Sawara cypress
  order: Pinales
  native_region: central and southern Japan, on the islands of Honshū and Kyūshū
  inaturalist_taxon_id: 123925
  description: >-
    Sawara cypress gets its botanical name, pisifera, "pea-bearing", from its small round cones. In
    Japan its lemon-scented, rot-resistant wood is used to build palaces, temples, shrines and
    baths, though it is valued less than that of its relative, hinoki.
- name: Chameacyparis
  common_name: False Cypress
- name: Chionanthus retusus
  common_name: Chinese fringetree
  order: Lamiales
  native_region: China, Japan, Korea and Taiwan
  inaturalist_taxon_id: 452213
  description: >-
    Chinese fringetree is grown for its feathery heads of white flowers. Near Inuyama, in Japan's
    Aichi Prefecture, a grove of seven old trees known for their yearly bloom has been protected as
    a natural monument since 1923. The genus name, Chionanthus, means "snow flower".
- name: Chitalpa tashkentensis
  common_name: Chitalpa
  order: Lamiales
  garden_origin: a hybrid of desert willow and a catalpa, first raised in Uzbekistan in 1964
  description: >-
    Chitalpa's name joins those of its parents, Chilopsis (desert willow) and Catalpa. Nearly all
    chitalpas in North America are thought to come from cuttings of two clones brought from
    Uzbekistan in 1977, and all carry a plant-disease bacterium, Xylella fastidiosa, from the
    infected desert willow used in the original crosses.
- name: Cladrastis kentukea
  common_name: Kentucky yellowwood
  native_region: scattered sites in the southeastern United States, from North Carolina to Oklahoma
  inaturalist_taxon_id: 117430
  description: >-
    Kentucky yellowwood is one of the rarest trees in eastern North America. It is named for its
    yellow heartwood, used for gunstocks, specialist furniture and woodturning. Its fragrant white
    flowers hang in long clusters like wisteria, but it blooms heavily only every second or third
    year.
- name: Conifer Evergreen
  common_name: Conifer Evergreen Small
  description: This tree has only been identified as an evergreen conifer, not to genus or species.
- name: Cornus
  common_name: Dogwood
  order: Cornales
  inaturalist_taxon_id: 54777
  description: This tree has only been identified to genus, not species.
- name: Cornus × 'Venus'
  common_name: Venus dogwood
  garden_origin: a hybrid bred by Elwin Orton at Rutgers University in New Jersey, released in 2004
  description: >-
    'Venus' crosses kousa dogwood from East Asia with Pacific dogwood, British Columbia's floral
    emblem. Its white flower heads reach 15 cm (6 in) across, and it resists the anthracnose disease
    that has killed many Pacific dogwoods.
- name: Cornus × Eddies
  common_name: Dogwood
- name: Cornus alternifolia
  common_name: Pagoda dogwood
  order: Cornales
  native_region: eastern North America, from Newfoundland and Manitoba to northern Florida
  inaturalist_taxon_id: 54775
  description: >-
    Pagoda dogwood is named for its branches, which spread in flat tiers with gaps between them,
    like the roofs of a pagoda. Unlike most dogwoods it has alternate rather than paired leaves,
    which gives it its botanical name and another common name, alternate-leaf dogwood.
  wildlife:
    - who: [eastern cottontail rabbits]
      what: eat its leaves and bark
- name: Cornus florida
  common_name: Flowering dogwood
  native_region: eastern North America and northern Mexico
  inaturalist_taxon_id: 54777
  description: >-
    Flowering dogwood is the state tree of Virginia and Missouri. In 1915 the United States sent 40
    to Tokyo in return for Washington's cherry trees; all but one died, and in 2012, for the
    cherries' centenary, 3,000 more were sent. Its white or pink "petals" are bracts around a
    cluster of tiny flowers.
- name: Cornus kousa
  common_name: Kousa dogwood
  native_region: Japan, Korea and China
  inaturalist_taxon_id: 128614
  description: >-
    Kousa dogwood flowers about a month later than the eastern flowering dogwood, and its white
    bracts are pointed rather than rounded. Its pink to red fruits, about 2 cm across, have a sweet,
    edible pulp with a flavour like ripe persimmon. It resists the anthracnose disease that has
    killed many wild Pacific dogwoods.
- name: Cornus mas
  common_name: Cornelian cherry
  order: Cornales
  native_region: western and southern Europe and southwestern Asia
  inaturalist_taxon_id: 55858
  description: >-
    Cornelian cherry wood is so dense that it sinks in water. Greek craftsmen made spears, javelins
    and bows from it, the army of Alexander the Great used it for its infantry's long spears, and
    Greek poets used its name to mean "spear". Its tart red fruit, like cranberry and sour cherry,
    is made into jams and drinks, especially in Iran.
- name: Cornus nuttallii
  common_name: Pacific dogwood
  native: true
  native_region: the Pacific coast of North America, from southern British Columbia to southern California
  sencoten_name: ȻETXIȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#332.3.
  inaturalist_taxon_id: 76447
  description: >-
    Pacific dogwood bark is one of the ten barks in a W̱SÁNEĆ (Saanich) family medicine for
    tuberculosis, and its hard wood made bows, arrow shafts and combs. It has been British
    Columbia's floral emblem since 1956. Thomas Nuttall first described it in 1834, and his friend
    John James Audubon named it after him.
  turner_pages: vol. 1, pp. 109, 364, 462
  wildlife:
    - who: [band-tailed pigeons, pileated woodpeckers]
      what: eat its red fruit
    - who: [Wilson's warblers]
      what: shelter in it
- name: Cornus × 'Eddie's White Wonder'
  common_name: Eddie's White Wonder dogwood
  garden_origin: >-
    a hybrid of Pacific dogwood and the eastern flowering dogwood, raised by Henry Eddie in
    Vancouver in the 1940s
  description: >-
    'Eddie's White Wonder' was raised by the Vancouver nurseryman Henry Eddie, who crossed British
    Columbia's Pacific dogwood with the flowering dogwood of eastern North America. It looks most
    like Pacific dogwood but is hardier, flowers two or three weeks later and sets no seed, and its
    leaves turn red and purple in autumn.
- name: Corylus
  common_name: Hazel
  order: Fagales
  inaturalist_taxon_id: 54491
  description: This tree has only been identified to genus, not species.
- name: Corylus avellana
  common_name: Common hazel
  order: Fagales
  native_region: Europe and western Asia, from Ireland and Scandinavia to the Urals and Iran
  inaturalist_taxon_id: 54491
  description: >-
    Common hazel's species name, avellana, comes from the town of Avella in Italy, by way of Pliny
    the Elder and a 1542 herbal that called it the "wild nut of Avella". In lowland England it was a
    mainstay of field hedgerows, and was coppiced for poles to build wattle-and-daub walls and farm
    fences.
  wildlife:
    - who: [squirrels, crows, jays]
      what: crack open its nuts
- name: Corylus colurna
  common_name: Turkish hazel
  order: Fagales
  native_region: >-
    southeastern Europe and western Asia, from the Balkans through Turkey to the Caucasus
  inaturalist_taxon_id: 367960
  description: >-
    Turkish hazel, also called Byzantine or Constantinople hazel, carries its small, thick-shelled
    nuts in tight clusters, each wrapped in a bristly husk. It doesn't sucker like common hazel, so
    nut growers use it as a single-stemmed rootstock for grafting common hazel.
- name: Cotinus coggygria
  common_name: Smoke tree
  order: Sapindales
  native_region: southern Europe, central Asia and the Himalayas, east to northern China
  inaturalist_taxon_id: 133366
  description: >-
    Smoke tree is named for its feathery plumes: most of its flowers fail and lengthen into pinkish
    wisps that look like smoke when seen together. Its wood once gave a yellow dye, young fustic,
    and like other sumacs it has been used for red dyes, as in Middle Eastern soumak rugs.
- name: Cotoneaster
  common_name: Cotoneaster
  order: Rosales
  inaturalist_taxon_id: 57254
  description: This tree has only been identified to genus, not species.
- name: Cotoneaster x
  common_name: Cotoneaster
  inaturalist_taxon_id: 790747
- name: Crataegus
  common_name: Hawthorn
  order: Rosales
  inaturalist_taxon_id: 51147
  description: This tree has only been identified to genus, not species.
- name: Crataegus × grignonensis
  common_name: Grignon hawthorn
  garden_origin: >-
    a Mexican hawthorn seedling, first raised at the Grignon arboretum in France in 1873
  description: >-
    Grignon hawthorn's pollen parent is uncertain: it was first thought to be cockspur hawthorn, but
    that cross gave the quite different Lavallée's hawthorn, and common hawthorn is now thought more
    likely. It was named in 1890 from a description by Pierre Mouillefert, professor of forestry at
    the national agricultural school at Grignon.
- name: Crataegus × lavalleei
  common_name: Lavallée's hawthorn
  garden_origin: a hybrid hawthorn raised in France in the 1870s, at the arboretum of Alphonse Lavallée
  inaturalist_taxon_id: 143798
  description: >-
    Lavallée's hawthorn has glossy, dark green leaves. Its parents were a Mexican hawthorn and,
    probably, the pear hawthorn of eastern North America.
- name: Crataegus × mordenensis
  common_name: Morden hawthorn
  garden_origin: a hybrid of European and North American hawthorns, first raised in Manitoba in 1935
  inaturalist_taxon_id: 706684
  description: >-
    Morden hawthorn takes its name from Morden, Manitoba, where it was bred at the Agriculture
    Canada plant breeding station. Its parents are Midland hawthorn, a tree of old woods and
    hedgerows in Britain and Europe, and the North American fleshy hawthorn, Crataegus succulenta.
  cultivars:
    - name: Snowbird
      description: A hardy hawthorn from Canada, raised from 'Toba', with double white flowers that stay white.
    - name: Toba
      description: >-
        A hardy hawthorn bred at the Morden Research Station in Manitoba, with double white flowers
        that turn pink as they age.
- name: Crataegus crus-galli
  common_name: Cockspur hawthorn
  order: Rosales
  native_region: eastern North America, from southern Ontario to Texas and Florida
  inaturalist_taxon_id: 54824
  description: >-
    Cockspur hawthorn is named for its sharp thorns, several centimetres long, which look like the
    spur on a rooster's leg; crus-galli is Latin for "rooster's leg". Its white flowers have a scent
    most people find unpleasant. The thornless variety, inermis, is especially popular in gardens
    and along streets.
- name: Crataegus douglasii
  common_name: Black hawthorn
  native: true
  native_region: western North America, with outlying populations around the Great Lakes
  inaturalist_taxon_id: 76469
  description: >-
    Black hawthorn charcoal is used as a face paint in winter dances, said to protect the wearer
    (Halkomelem), and the thorny tree itself is valued for its spiritual protection (Hul’qumi’num).
    Its hard wood made digging sticks, hammers and tool handles. It is named after David Douglas,
    the Scottish botanist who collected its seed.
  turner_pages: vol. 1, pp. 341, 387; vol. 2, pp. 305, 323
  wildlife:
    - who: [quail]
      what: eat its black berries
- name: Crataegus laevigata
  common_name: Midland hawthorn
  order: Rosales
  native_region: western and central Europe, from Britain and Spain east to Ukraine
  inaturalist_taxon_id: 54428
  description: >-
    Midland hawthorn is a tree of ancient woodland and old hedgerows in Britain. Many of the red- and
    pink-flowered hawthorns planted along streets, such as 'Paul's Scarlet', are cultivars of this
    species or its hybrids.
- name: Crataegus oxyacantha
  # Crataegus oxyacantha is a rejected name of uncertain application, used for both common hawthorn
  # (C. monogyna) and Midland hawthorn (C. laevigata). The City's trees are probably C. monogyna.
  common_name: Common hawthorn
  order: Rosales
  native_region: Europe, North Africa and western Asia
  inaturalist_taxon_id: 54428
  description: >-
    Common hawthorn is the hedgerow tree of Britain, where its white blossom is called may, after
    the month it opens.
  cultivars:
    - name: Paul's Scarlet
      match: paul
      description: >-
        A hawthorn with double scarlet-pink flowers in May, introduced by William Paul's nursery in
        England in the 1860s.
- name: Crataegus phaenopyrum
  common_name: Washington hawthorn
  order: Rosales
  native_region: the eastern United States
  inaturalist_taxon_id: 141714
  description: >-
    Washington hawthorn's small red fruit grows close together in large clusters. The fruit is
    edible, with a mild flavour, and can be made into jelly or crushed for tea, and the wood, hard
    like that of other hawthorns, has been used for tools.
  wildlife:
    - who: [squirrels]
      what: eat its fruit
- name: Crataegus punctata
  common_name: Dotted Hawthorn
  order: Rosales
  inaturalist_taxon_id: 54830
- name: Crataegus viridis
  common_name: Green hawthorn
  order: Rosales
  native_region: the southeastern United States
  inaturalist_taxon_id: 127068
  description: >-
    Green hawthorn, or southern thorn, varies a great deal in the wild, and many good garden forms
    could be selected from it. The best known is 'Winter King'.
- name: Cryptomeria japonica
  common_name: Japanese cedar
  native_region: Japan
  inaturalist_taxon_id: 71147
  description: >-
    Japanese cedar, sugi in Japanese, is the national tree of Japan, and is commonly planted around
    temples and shrines, where some trees are centuries old.
- name: Cunninghamia lanceolata
  common_name: Cunninghamia / China-fir
  order: Pinales
  native_region: southern China, northern Vietnam and Laos
  inaturalist_taxon_id: 127861
  description: >-
    The genus name Cunninghamia honours Dr. James Cunningham, a British doctor who introduced this
    species into cultivation in 1702 and botanist Allan Cunningham.


    Cunninghamia is a prized timber tree in China, producing soft, highly durable scented wood
    similar to that of Coast Redwood and Sugi. It is used in particular for manufacture of coffins
    and in temple building where the scent is valued.
- name: Cupressus
  common_name: Cypress
  order: Gleicheniales
  inaturalist_taxon_id: 322545
  description: This tree has only been identified to genus, not species.
- name: Cupressus × leylandii
  common_name: Leyland cypress
  garden_origin: >-
    a chance cross between Monterey cypress and yellow-cedar, first found on an estate in Wales in
    1888
  description: >-
    Leyland cypress was found at Leighton Hall, the estate of the Liverpool banker Christopher
    Leyland, where yellow-cedar had been pollinated by Monterey cypress. Fast-growing and tolerant
    of wind and salt, it was for many years the best-selling plant in British garden centres, at up
    to 10% of their sales.
- name: Cupressus arizonica
  common_name: Arizona cypress
  order: Pinales
  native_region: scattered mountain groves in northern Mexico and the southwestern United States
  inaturalist_taxon_id: 57888
  description: >-
    Arizona cypress keeps its cones closed for many years, opening them only after the branch that
    carries them is killed, such as in a wildfire, so the seeds land on freshly burned ground.
    Unlike Monterey cypress, it resists cypress canker, a fungal disease, which makes it a reliable
    garden tree. Most plant databases now call it Hesperocyparis arizonica.
- name: Cupressus cashmeriana
  common_name: Kashmir cypress / Bhutan cypress
  order: Pinales
  native_region: the eastern Himalayas, in Bhutan and northeast India
  inaturalist_taxon_id: 136152
  description: >-
    Kashmir cypress is the national tree of Bhutan, where it has been planted around Buddhist
    monasteries and temples for centuries.
- name: Cupressus nootkatensis
  common_name: Yellow-cedar
  native: true
  native_region: the Pacific coast of North America, from Alaska to northern California
  sencoten_name: POŚELEḰ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#322.
  inaturalist_taxon_id: 126792
  description: >-
    Coast Salish peoples traded yellow-cedar bow wood to the interior, and coastal peoples carved
    its wood into paddles and smaller pieces. Its soft inner bark, peeled in part from living trees
    so they survive, was woven into baskets, mats, clothing and blankets, and its boughs are used in
    sweat baths and for protection (Kwakwaka’wakw). The name nootkatensis comes from Nootka, the old
    name for the Nuu-chah-nulth, on whose lands Europeans first described it.
  turner_pages: vol. 1, p. 342; vol. 2, pp. 121, 184, 302
- name: Davidia involucrata
  common_name: Dove tree
  order: Cornales
  native_region: the mountain forests of south-central and southeastern China
  inaturalist_taxon_id: 128506
  description: >-
    Dove tree is named for the two large white bracts beneath each flower head, which flutter in the
    breeze like doves or handkerchiefs. The genus honours Père Armand David, a French missionary and
    naturalist who described it in 1869 from a single tree in China. Ernest Wilson, sent to collect
    it, was shipwrecked on the way home but saved his specimens.
- name: Elaeagnus angustifolia
  common_name: Russian olive
  order: Rosales
  native_region: western and central Asia, from the Caucasus and Iran to Mongolia and northern China
  inaturalist_taxon_id: 64694
  description: >-
    Russian olive is named for its likeness to the true olive, to which it is not related. Its dried
    fruit is one of the seven items of the Haft-sin table set out for Nowruz, the Persian spring
    festival. In the United States it has become invasive, spreading along rivers where cottonwoods
    have died.
- name: Elaeocarpus decipiens
  common_name: Japanese blueberry tree
  order: Oxalidales
  native_region: southern China, Taiwan, Vietnam, Korea and Japan
  inaturalist_taxon_id: 428622
  description: >-
    Japanese blueberry tree is named for its small, dark blue, olive-shaped fruit, which is not
    edible. Its new leaves come out red and turn green as they age, so the evergreen crown shows a
    mix of red, brown and green, and its small cream to pale pink flowers are often hidden among the
    leaves.
- name: Eucalyptus
  common_name: Gum Tree
  order: Myrtales
  inaturalist_taxon_id: 53398
  description: This tree has only been identified to genus, not species.
- name: Eucalyptus pauciflora
  common_name: Snow gum
  order: Myrtales
  native_region: the mountains and cold high plains of southeastern Australia and Tasmania
  inaturalist_taxon_id: 208115
  description: >-
    Snow gum is the most cold-tolerant eucalyptus: its alpine subspecies, niphophila, survives −23
    °C (−9 °F) and year-round frosts in the Australian Alps. Its smooth white, grey or yellow bark
    peels in ribbons and is often marked with insect scribbles. The name pauciflora, "few-flowered",
    is a misnomer, perhaps from an early specimen that lost its buds in transit.
- name: Eucryphia x
  common_name: Rostrevor eucryphia
  garden_origin: >-
    a hybrid of a Chilean and a Tasmanian eucryphia, first raised at Rostrevor in Northern Ireland
  inaturalist_taxon_id: 782371
  description: >-
    Rostrevor eucryphia blooms in late summer and autumn, with sweetly scented flowers 3–6 cm (1–2
    in) across: four creamy-white petals around a mass of stamens. Tasmanian leatherwood, one of its
    wild relatives, is a major source of honey. The name Eucryphia comes from the Greek for
    "well-covered", for the leaves clustered at the branch tips.
- name: Euonymus
  common_name: Spindle Tree
  order: Celastrales
  inaturalist_taxon_id: 117433
  description: This tree has only been identified to genus, not species.
- name: Euonymus europaeus
  common_name: European spindle
  order: Celastrales
  native_region: much of Europe
  inaturalist_taxon_id: 55847
  description: >-
    European spindle is named for its very hard wood, which can be cut to a sharp point and was once
    made into spindles for spinning wool and into butchers' skewers. Artists prize its charcoal for
    its strength and density. Its pink autumn capsules split open to show bright orange seeds, and
    the fruit is poisonous.
- name: Fagus
  common_name: Beech
  order: Fagales
  inaturalist_taxon_id: 49202
  description: This tree has only been identified to genus, not species.
- name: Fagus sylvatica
  common_name: European beech
  order: Fagales
  native_region: most of Europe, from southern England and Spain to Sweden and Ukraine
  inaturalist_taxon_id: 54227
  cultivars:
    - name: Dawyck
      match: fastigiata
      description: >-
        A columnar European beech, descended from a tree found at Dawyck in the Scottish Borders in
        the 1800s.
    - name: Atropunicea
      description: Copper beech, the purple-leaved form of European beech.
    - name: Purpurea
      description: Copper beech, the purple-leaved form of European beech.
    - name: Riversii
      description: >-
        A copper beech with especially dark purple leaves, raised by Rivers nursery in England in the
        late 1800s.
  description: >-
    European beech has smooth, silver-grey bark. Beech nuts were once gathered to feed pigs and
    pressed for oil.
- name: Ficus carica
  common_name: Common fig
  order: Rosales
  native_region: the Mediterranean region and western and southern Asia
  inaturalist_taxon_id: 60218
  description: >-
    Common fig may be the first plant people ever cultivated: sterile, seedless figs from a
    Neolithic village near Jericho, dated to about 9400 BC, are a thousand years older than the
    first domesticated wheat. Each fig is a hollow pod lined with tiny flowers, which a specialized
    wasp enters to pollinate, though common figs can ripen without it.
- name: Fraxinus
  common_name: Ash
  order: Lamiales
  inaturalist_taxon_id: 54805
  description: This tree has only been identified to genus, not species.
- name: Fraxinus americana
  common_name: White ash
  order: Lamiales
  native_region: >-
    eastern and central North America, from Nova Scotia and Minnesota to Florida and Texas
  inaturalist_taxon_id: 54805
  description: >-
    White ash is named for the pale undersides of its leaves, and unlike most ashes, which turn
    yellow, it colours orange and red in autumn. Its hard, straight-grained wood is the traditional
    timber for baseball bats. Since the early 2000s the emerald ash borer, a beetle from Asia, has
    killed hundreds of millions of white ashes in North America.
- name: Fraxinus angustifolia
  common_name: Narrow-leaved ash
  order: Lamiales
  native_region: central and southern Europe, northwest Africa, and southwest Asia
  inaturalist_taxon_id: 82881
  description: >-
    Narrow-leaved ash is named for its slender leaflets. In Australia it has spread so widely that
    it is a weed, known there as desert ash. Its cultivar 'Raywood', the claret ash, was raised in
    the Adelaide Hills of South Australia and is planted for its wine-red autumn colour, though its
    branches are brittle.
- name: Fraxinus excelsior
  common_name: European ash
  order: Lamiales
  native_region: Europe and southwest Asia, from Ireland to the Caucasus
  inaturalist_taxon_id: 125440
  description: >-
    European ash is the tree of Norse myth: Yggdrasil, the world tree that holds the nine worlds in
    its roots and branches, is a vast ash. Its tough, flexible wood is the only timber used for
    hurleys, the sticks of Irish hurling, a game known as "the clash of the ash". It is easy to tell
    from other ashes by its jet-black buds.
- name: Fraxinus holotricha
  common_name: Balkan ash
  order: Lamiales
  inaturalist_taxon_id: 889292
- name: Fraxinus latifolia
  common_name: Oregon ash
  order: Lamiales
  native_region: >-
    the Pacific coast of North America, from southwestern British Columbia to California
  inaturalist_taxon_id: 63878
  description: >-
    The Cowlitz made canoe paddles and digging sticks from Oregon ash wood. Its bowls, or the wood
    to carve them, were also traded to the Makah from peoples to the south or east: five were found
    at Ozette, a Makah village on Washington's outer coast where the tree doesn't grow, buried by
    mudslides around 1700. It tolerates flooding far better than Douglas-fir or grand fir.
  turner_pages: vol. 1, pp. 108–109; vol. 2, p. 123
  wildlife:
    - who: [squirrels]
      what: eat its seeds
    - who: [deer]
      what: browse its leaves and sprouts
- name: Fraxinus ornus
  common_name: Manna ash
  order: Lamiales
  native_region: southern Europe and southwest Asia, from Spain and Italy east to Turkey and Lebanon
  inaturalist_taxon_id: 319281
  description: >-
    Manna ash is named for the sweet sap that seeps from cuts in its bark, which was compared to the
    biblical manna by about 1400. The sugar mannose and the sugar alcohol mannitol are both named
    after it.
  cultivars:
    - name: Arie Peters
      description: A compact, rounded Dutch selection of manna ash, with fragrant white flowers in late spring.
- name: Fraxinus pennsylvanica
  common_name: Green ash
  order: Lamiales
  native_region: >-
    eastern and central North America, from Nova Scotia and Alberta to Florida and Texas
  inaturalist_taxon_id: 54808
  description: >-
    Green ash, also called red ash, is the most widely distributed of the American ashes. The
    emerald ash borer, a beetle from Asia, has killed vast numbers of green ash across eastern North
    America, and in 2024 it was found in Vancouver, its first appearance in British Columbia. A few
    "lingering ash" that survived in the wild are being studied for resistance.
- name: Fraxinus velutina
  common_name: Velvet ash
  order: Lamiales
  native_region: >-
    the southwestern United States and northern Mexico, from southern California to Texas
  inaturalist_taxon_id: 64132
  description: >-
    Velvet ash is named for the soft down on its young shoots; it is also called Arizona ash and
    Modesto ash. It is a close relative of Oregon ash and replaces it to the south, and in central
    California the two merge with no clear boundary.
- name: Fremontodendron californicum
  common_name: Flannel bush
  order: Malvales
  native_region: California, with small, isolated populations in Arizona and Baja California, Mexico
  inaturalist_taxon_id: 63609
  description: >-
    Flannel bush is named for the soft, flannel-like hairs on its leaves, which brush off easily and
    can irritate skin and eyes. The genus honours John Charles Frémont, a 19th-century explorer of
    western North America. In California, the Yokuts and Kawaiisu peoples used its wood for building
    and furniture, and its bark for cordage and nets.
- name: Ginkgo biloba
  common_name: Ginkgo
  native_region: China
  inaturalist_taxon_id: 64350
  description: >-
    Ginkgo is the last living species of a group of plants that first appeared more than 290 million
    years ago, which makes it one of the best-known living fossils. Some ginkgos survived the atomic
    bombing of Hiroshima.
  cultivars:
    - name: Princeton Sentry
      match: princeton
      description: >-
        A narrow, upright male ginkgo. Only female ginkgos produce the foul-smelling seeds, so male
        cultivars are preferred for streets.
    - name: Female
      match: (f)
      description: A female ginkgo. In autumn it drops fleshy seeds that smell strongly of rancid butter.
    - name: Autumn Gold
      description: A broad, male ginkgo with especially bright golden autumn colour.
- name: Gleditsia inermis
  common_name: Honey locust
- name: Gleditsia triacanthos
  common_name: Honey locust
  order: Fabales
  native_region: central and eastern North America, mainly the Mississippi and Ohio river valleys
  inaturalist_taxon_id: 54797
  description: >-
    Honey locust's long, twisted pods hold a sweet pulp, which gives the tree its name. Wild trees
    bear long, branched thorns, but the ones planted on streets are thornless forms. Outside its
    range it can be an aggressive invasive species.
  wildlife:
    - who: [crows]
      what: eat its seeds in winter
  cultivars:
    - name: Street Keeper
      description: A narrow, upright, thornless honey locust bred for streets.
    - name: Halka
      description: A fast-growing, thornless honey locust with a spreading crown.
    - name: Shademaster
      match: shadem
      description: A thornless, nearly seedless honey locust with an upright, spreading crown.
    - name: Skyline
      match: skylin
      description: A thornless honey locust with a pyramidal crown and golden autumn colour.
- name: Gleditsia triacanthos var. inermis
  common_name: Thornless honey locust
  native_region: central and eastern North America, mainly the Mississippi and Ohio river valleys
  description: >-
    The thornless honey locust lacks the long, branched thorns of wild trees, which makes it the
    form planted along streets. Its long, twisted pods hold a sweet pulp, which gives the tree its
    name.
  wildlife:
    - who: [crows]
      what: eat its seeds in winter
- name: Gymnocladus dioicus
  common_name: Kentucky coffeetree
  order: Fabales
  native_region: the central United States and southern Ontario, though it is rare throughout
  inaturalist_taxon_id: 163451
  description: >-
    Kentucky coffeetree is named for its seeds, which early settlers roasted as a coffee substitute;
    raw, the seeds and pods are poisonous. Its leathery pods are too tough for most living animals
    to chew and may once have been eaten by large mammals now extinct. The genus name means "naked
    branch", since it has few small twigs and leafs out late.
  cultivars:
    - name: Espresso
      description: A male Kentucky coffeetree, so it doesn't drop the species' large seed pods.
- name: Halesia monticola
  common_name: Mountain silverbell
  order: Ericales
  native_region: the southern Appalachian Mountains of the eastern United States
  description: >-
    Mountain silverbell is the largest of the silverbells, reaching 34 m (112 ft) in the Great Smoky
    Mountains, and its white flowers are larger than those of its relatives. It begins to bloom when
    only about 4 m (13 ft) tall. Botanists disagree on whether it is a species of its own or a
    mountain form of Carolina silverbell.
- name: Halesia tetraptera
  common_name: Carolina silverbell
  order: Ericales
  native_region: the southeastern United States, from West Virginia to northern Florida and Oklahoma
  inaturalist_taxon_id: 163506
  description: >-
    Carolina silverbell's dry fruit has four wings running along its length, which gives the species
    its name, tetraptera, "four-winged". The genus honours Stephen Hales, an 18th-century English
    clergyman and scientist. In the wild it is thinly scattered and becoming rare in many areas.
  wildlife:
    - who: [bees, butterflies]
      what: visit its flowers
- name: Hesperocyparis macrocarpa
  common_name: Monterey cypress
  order: Pinales
  native_region: two small groves on the California coast, near Monterey
  inaturalist_taxon_id: 322545
  description: >-
    Monterey cypress's huge trunks led to claims that some trees were 2,000 years old, which the
    botanist Willis Linn Jepson put down to "a popular craving for superlatives"; the oldest dated
    from physical evidence was 284 years old. Trees planted in New Zealand around 1860 are still
    alive.
- name: Ilex
  common_name: Holly
  order: Fagales
  inaturalist_taxon_id: 60749
- name: Ilex altaclarensis
  common_name: Highclere holly
  garden_origin: >-
    a hybrid of English holly and the tender Madeira holly, first raised at Highclere Castle in
    England in 1835
  description: >-
    Highclere holly's botanical name, altaclerensis, is a Latin form of Highclere. Like all hollies,
    it has male and female flowers on separate trees, and only the females carry red berries.
- name: Ilex aquifolium
  common_name: English holly
  order: Aquifoliales
  native_region: western and southern Europe, North Africa and southwest Asia
  inaturalist_taxon_id: 53856
  description: >-
    English holly's glossy, spiny leaves and red berries have been used as winter decoration since
    before Christianity. Only female trees bear berries. Birds spread the seeds, and holly has become
    an invasive species in the forests of southwestern British Columbia.
- name: Ilex opaca
  common_name: American holly
  order: Aquifoliales
  native_region: the eastern United States, from Massachusetts to central Florida and eastern Texas
  inaturalist_taxon_id: 60749
  description: >-
    American holly is the state tree of Delaware. Its leaves are duller than those of English holly,
    and its pale, close-grained wood has been used for engraving blocks and whip handles, and dyed
    to stand in for ebony. Over 1,000 cultivars have been selected, including ones with yellow
    berries.
  wildlife:
    - who: [cedar waxwings, thrushes]
      what: eat its berries
    - who: [bees, moths]
      what: pollinate its flowers
- name: Ilex spp.
  common_name: Holly
  description: This tree has only been identified to genus, not species.
- name: Juglans nigra
  common_name: Black walnut
  order: Fagales
  native_region: eastern North America, from southern Ontario to Georgia and central Texas
  inaturalist_taxon_id: 54504
  description: >-
    Black walnut's roots, leaves and husks release juglone, a compound that can poison tomatoes,
    apples, pines and birches planted near it; Pliny the Elder warned in the first century that
    walnut shade is "poison to all plants within its compass". The husks stain hands and pavement,
    and have long been used as a natural dye and ink.
- name: Juglans regia
  common_name: English walnut
  native_region: the mountains of Central Asia, from the Balkans east to the Himalayas and southwest China
  inaturalist_taxon_id: 63935
  description: >-
    English walnut is also called Persian walnut: it comes from Iran and Central Asia, and the
    ancient Greeks knew it as the Persian nut. The genus name, Juglans, means "Jupiter's nut" in
    Latin.
- name: Juniperus
  common_name: Juniper
  order: Pinales
  inaturalist_taxon_id: 49399
  description: This tree has only been identified to genus, not species.
- name: Juniperus chinensis
  common_name: Chinese juniper
  native_region: China, Taiwan, Myanmar, Japan, Korea and the Russian Far East
  inaturalist_taxon_id: 135925
  description: >-
    Chinese juniper is one of the most important trees in bonsai, especially the Japanese form
    called Shimpaku; famous specimens include the 250-year-old "Omiya tree" at the Birmingham
    Botanical Gardens in England. Mature trees often carry two kinds of foliage at once: needle-like
    juvenile leaves, mostly on shaded lower shoots, and tiny scale-like adult leaves.
- name: Juniperus communis
  common_name: Common juniper
  order: Pinales
  native_region: cool regions across the Northern Hemisphere, the widest range of any woody plant
  inaturalist_taxon_id: 58725
  description: >-
    Common juniper is taken as a medicine that must all be drunk, or it will not work (Haida). A
    decoction is drunk in the sweathouse and used as a purifying wash for hunters (Nlaka’pamux) or
    as a fumigant against death and illness (Okanagan), and juniper is one of the plants used to
    ritually treat berry bushes, fishing gear and people affected by nímính, the ritually powerful
    and vulnerable state that comes with birth, puberty, widowhood and death (Tsilhqot’in). Its
    Tsilhqot’in name means "raven’s arrow". Gin is named after the French and Dutch words for
    juniper, whose berry-like cones flavour it.
  turner_pages: vol. 1, pp. 132, 553; vol. 2, pp. 302, 341–342
- name: Juniperus maritima
  # Was Juniperus scopulorum. The wild junipers of Salish Sea shores were split off as J. maritima
  # (R.P. Adams, 2007); BC's Conservation Data Centre lists it, though some databases don't accept it
  # yet. The three mapped trees are heritage records on the shore at View Royal and Towner Bay.
  common_name: Seaside juniper
  order: Pinales
  native: true
  sencoten_name: PEȾN¸Á¸IȽĆ
  native_region: >-
    the shores and dry rocky ridges of the Salish Sea, in southwestern British Columbia and
    northwestern Washington
  sencoten_url: http://saanich.montler.net/WordList/plants.html#380.
  description: >-
    Seaside juniper boughs are hung in the house or burned on the stove as incense to keep sickness
    away during epidemics (W̱SÁNEĆ, western Washington peoples), and an infusion of the boughs is
    drunk for colds, coughs and sore throats. Its Quw’utsun’ (Cowichan) name means "rank-smelling"
    or "skunk-like plant". It was named as its own species in 2007, when genetic studies showed that
    the junipers of Salish Sea shores, long called Rocky Mountain juniper, are distinct; it also
    ripens its cones faster and doesn't interbreed with other junipers.
  turner_pages: vol. 1, pp. 128, 423; vol. 2, p. 302
- name: Juniperus squamata
  common_name: Flaky juniper
  order: Pinales
  native_region: the Himalayas and China, from Afghanistan to Taiwan
  inaturalist_taxon_id: 135885
  description: >-
    Flaky juniper is named for its flaking brown bark. It grows high in the mountains of Asia, up to
    4,900 m (16,100 ft), and is the unofficial provincial tree of Khyber Pakhtunkhwa, in Pakistan.
    In gardens it is grown for its blue-green foliage and compact shape, in forms such as 'Blue
    Star'.
- name: Juniperus virginiana
  common_name: Eastern redcedar
  native_region: eastern North America, from southeastern Canada to the Gulf of Mexico
  inaturalist_taxon_id: 49399
  description: >-
    Eastern redcedar gave Baton Rouge, Louisiana, its name: French traders called the place "red
    stick" after the reddish cedar poles that Native American tribes used to mark their hunting
    territories. Its fragrant heartwood resists decay and repels moths, which made it the classic
    lining for cedar chests and closets; it was also a pencil wood until supplies ran low in the
    1940s.
  wildlife:
    - who: [cedar waxwings, raccoons, rabbits]
      what: eat its berries
- name: Kobus Magnolia
  common_name: Magnolia
  inaturalist_taxon_id: 143787
- name: Koelreuteria bipinnata
  common_name: Chinese flame tree
  native_region: southern China
  notable: true
  inaturalist_taxon_id: 133608
  description: >-
    Chinese flame tree is one of the few trees that flower in late summer, with sprays of small
    yellow flowers followed by papery, reddish, three-lobed seed pods.
- name: Koelreuteria paniculata
  common_name: Goldenrain tree
  order: Sapindales
  native_region: China and Korea
  inaturalist_taxon_id: 58320
  description: >-
    Goldenrain tree was one of the five official memorial trees of China's Zhou dynasty, planted
    beside the tombs of scholars. Its yellow summer flowers are followed by papery, three-sided pods
    like small lanterns, which ripen from green to orange and pink. The genus honours Joseph
    Kölreuter, an 18th-century German botanist who pioneered the study of plant hybrids.
- name: Laburnum × watereri
  common_name: Golden chain tree
  native_region: the Alps, where its two parent species grow together
  inaturalist_taxon_id: 899503
  description: >-
    Golden chain tree's best-known form is 'Vossii', with especially long chains of yellow flowers.
    All parts of the plant are poisonous, though deaths are very rare.
- name: Laburnum anagyroides
  common_name: Common laburnum
  order: Fabales
  native_region: central and southern Europe
  inaturalist_taxon_id: 51810
  description: >-
    Common laburnum, or golden chain, inspired Laurelin, one of the two great trees in J.R.R.
    Tolkien's The Silmarillion, by way of a poem by Francis Thompson. Its seeds contain cytisine, a
    poisonous alkaloid that is also used as a medicine to help people stop smoking.
- name: Lagerstroemia indica
  common_name: Crape myrtle
  order: Myrtales
  native_region: subtropical Asia, from the Himalayas to southern China, the Philippines and Japan
  inaturalist_taxon_id: 135394
  description: >-
    Crape myrtle takes its name from its crinkled, crêpe-like petals, and its smooth, mottled,
    pinkish-grey bark peels away every year. In the United States it has come to symbolize the
    American South, along with southern magnolia. In Japan it is called sarusuberi, the title of a
    1983 manga by Hinako Sugiura set in the world of ukiyo-e art.
- name: Larix decidua
  common_name: European larch
  native_region: the mountains of central Europe
  inaturalist_taxon_id: 59747
  description: >-
    European larch is a conifer that sheds its needles each autumn, after they turn bright yellow.
    Three Dukes of Atholl in turn planted it widely, and larches planted in Scotland in 1725 and
    1737 still stand. Knot-free wood from old trees, called boatskin larch, is prized for building
    yachts.
- name: Larix occidentalis
  common_name: Western larch
  order: Pinales
  native_region: >-
    the inland mountains of southeastern British Columbia and the northwestern United States
  inaturalist_taxon_id: 69849
  description: >-
    Western larch, or "tamarack", is a people-eating monster in an Okanagan story, grabbing anyone
    who comes too close until Coyote strikes its top and declares that it will be used as medicine
    instead; that is why the tops of the tallest tamaracks are bent. Its sweet sap is a food, and a
    productive tree can give at least 4–5 litres twice a year (Spokan). In 2010 British Columbia
    began planting it about 1,000 km north of its range, the first assisted migration of a North
    American tree, to keep pace with a warming climate.
  turner_pages: vol. 1, p. 439; vol. 2, pp. 172, 261, 263–264
  wildlife:
    - who: [pine siskins]
      what: eat its seeds in winter
    - who: [woodpeckers]
      what: dig holes in the rotting heartwood of old trees
- name: Ligustrum sinense
  common_name: Chinese privet
  order: Lamiales
  native_region: China, Taiwan and Vietnam
  inaturalist_taxon_id: 128769
  description: >-
    Chinese privet was brought to North America for hedges and has escaped to become a serious
    invader of southeastern forests, covering more than a million hectares in 12 states from
    Virginia to Texas. Its small berries are considered poisonous. Its genus name, Ligustrum, means
    "binder" and was used for privet by Pliny and Virgil.
- name: Liquidambar styraciflua
  common_name: American sweetgum
  order: Saxifragales
  native_region: the southeastern United States, Mexico and Central America
  inaturalist_taxon_id: 49658
  description: >-
    The name Liquidambar, "liquid amber", refers to the fragrant resin that seeps from sweetgum's
    bark, which also gives the tree its common name. It is one of the most valuable timber trees of
    the southeastern United States.
  wildlife:
    - who: [goldfinches, purple finches]
      what: eat the seeds from its spiky seed balls
  cultivars:
    - name: Worplesdon
      description: >-
        A sweetgum raised in England, with deeply lobed leaves that reliably turn orange, red and
        purple in autumn.
    - name: Slender Silhouette
      match: slender silhouette
      description: >-
        An extremely narrow, columnar sweetgum, many times taller than it is wide, with the species'
        red and purple autumn colour. Planted where there's no room for a spreading crown.
- name: Liriodendron tulipifera
  common_name: Tulip tree
  order: Magnoliales
  native_region: eastern North America, from southern Ontario to Florida and Louisiana
  inaturalist_taxon_id: 53582
  description: >-
    Tulip tree is the tallest hardwood of eastern North America. Its tulip-shaped flowers, with
    nectar in their orange centres, make it a major honey plant in the eastern United States. It
    appears in Edgar Allan Poe's short story "The Gold-Bug".
  cultivars:
    - name: Emerald City
      description: An upright tulip tree with dark, glossy leaves.
    - name: Arnold
      description: >-
        A columnar tulip tree (sometimes sold as 'Fastigiatum') that flowers at a younger age than the
        species.
- name: Maackia amurensis
  common_name: Amur maackia
  order: Fabales
  native_region: northeastern China, Korea and the Russian Far East, around the Amur River
  inaturalist_taxon_id: 133358
  description: >-
    Amur maackia is named after Richard Maack, a 19th-century Siberian explorer who found it in the
    Amur River region, on the border between Siberia and China. In spring its unfolding buds are
    silvery, like flowers touched with frost, and are often considered more striking than its summer
    flowers.
- name: Magnolia
  common_name: Magnolia
  order: Magnoliales
  inaturalist_taxon_id: 83074
  description: This tree has only been identified to genus, not species.
- name: Magnolia × 'Galaxy'
  common_name: Galaxy magnolia
  garden_origin: a hybrid bred at the U.S. National Arboretum in Washington, D.C., and released in 1980
  description: >-
    'Galaxy' crosses the purple-flowered lily magnolia with Magnolia sprengeri 'Diva', two magnolias
    from China.
  bloom:
    from: early April
    to: late April
    colour: deep pink
    hue: deep pink
- name: Magnolia × Galaxy
  common_name: Magnolia
- name: Magnolia × soulangeana
  common_name: Saucer magnolia
  garden_origin: a hybrid of two Chinese magnolias, first raised near Paris in 1820
  description: >-
    Saucer magnolia is named after Étienne Soulange-Bodin, a retired cavalry officer from Napoleon's
    army, who raised it at his château de Fromont; its first seedlings flowered in 1826.
  bloom:
    from: mid March
    to: mid April
    colour: pink and white
    hue: pink
- name: Magnolia acuminata
  common_name: Cucumber tree
  order: Magnoliales
  native_region: >-
    the eastern United States, mainly the Appalachians, and a few sites in southern Ontario
  inaturalist_taxon_id: 117426
  description: >-
    Cucumber tree is named for its unripe fruit, which is green and shaped like a small cucumber.
    Unlike most magnolias, its flowers are small, yellow-green and borne high in the tree, but
    breeders have used it to give hybrids such as 'Yellow Bird' their yellow flowers and cold
    hardiness. In Canada it is protected as an endangered species.
  cultivars:
    - name: Yellow Bird
      description: >-
        A hybrid of cucumber tree magnolia from the Brooklyn Botanic Garden, with yellow, tulip-shaped
        flowers that open with the leaves.
- name: Magnolia campbellii
  common_name: Campbell's magnolia
  order: Magnoliales
  native_region: >-
    the eastern Himalaya, from Nepal and northeastern India to southwestern China and Myanmar
  inaturalist_taxon_id: 439967
  description: >-
    Campbell's magnolia is named after Archibald Campbell, superintendent of Darjeeling, in India.
    Its flowers, 15–25 cm (6–10 in) across, open on bare branches very early in the year; the inner
    petals stay upright while the outer ones spread, which may shelter the flower from rain and
    snow. Young trees take many years to begin flowering.
- name: Magnolia grandiflora
  common_name: Southern magnolia
  native_region: the southeastern United States, from North Carolina to Florida and Texas
  inaturalist_taxon_id: 83074
  description: >-
    Southern magnolia, also called bull bay, reached Britain in 1728. Sir John Colliton of Exeter,
    one of its first growers there, surrounded his tree with scaffolding and tubs so his gardeners
    could root its branches, and sold the young plants for five guineas each.
  wildlife:
    - who: [quail]
      what: eat its seeds
- name: Magnolia kobus
  common_name: Kobus magnolia
  order: Magnoliales
  native_region: Japan and Korea
  inaturalist_taxon_id: 143787
  bloom:
    from: mid March
    to: early April
    colour: white
    hue: white
  description: >-
    Kobus magnolia is slow to start flowering, but mature trees cover themselves in white flowers
    before the leaves open. Its Japanese name, kobushi, means "fist", after the shape of its knobbly
    fruit.
- name: Magnolia macrophylla
  common_name: Bigleaf magnolia
  order: Magnoliales
  native_region: scattered woodlands of the southeastern United States
  inaturalist_taxon_id: 165075
  description: >-
    Bigleaf magnolia has the largest simple leaves and the largest single flowers of any native tree
    or shrub in North America. Its leaves are usually 24–60 cm (9–24 in) long, occasionally up to 1
    m (39 in), and heavy enough to bend the branches. It is listed as threatened in North Carolina
    and endangered in Arkansas and Ohio.
- name: Magnolia stellata
  common_name: Star magnolia
  order: Magnoliales
  native_region: a small area of central Japan, around Ise Bay near Nagoya
  inaturalist_taxon_id: 126710
  description: >-
    Star magnolia was introduced to the United States in 1862 by Dr. George Robert Hall, and reached
    Britain in 1877 or 1878. Each flower has at least 12 narrow petals, and some cultivars have more
    than 30. Crossed with Kobushi magnolia, it gave Magnolia × loebneri, first raised in Germany in
    the early 1900s and first in flower in 1917.
  bloom:
    from: early March
    to: late March
    colour: white
    hue: white
- name: Malus
  common_name: Apple
  order: Rosales
  inaturalist_taxon_id: 77949
  description: This tree has only been identified to genus, not species.
  bloom:
    from: mid April
    to: mid May
    colour: pink to white
    hue: pale pink
  cultivars:
    - name: Royal Raindrops
      description: >-
        A disease-resistant crabapple with purple, deeply cut leaves and magenta-pink flowers,
        followed by small red fruit.
- name: Malus × purpurea
  common_name: Purple crabapple
  garden_origin: a hybrid crabapple raised by the Barbier nursery in Orléans, France, around 1900
  description: >-
    Purple crabapple gets its purple-red flowers, leaves and fruit from one parent, Niedzwetzky's
    apple, a red-fleshed wild apple from Central Asia.
  bloom:
    from: mid April
    to: mid May
    colour: deep pink
    hue: deep pink
- name: Malus × zumi
  common_name: Zumi crabapple
  native_region: Japan
  inaturalist_taxon_id: 578211
  description: >-
    Zumi crabapple is a natural hybrid of the Manchurian and Siebold's crabapples. Charles Sprague
    Sargent of the Arnold Arboretum brought it to North America in 1892, and it reached Kew in
    England in 1905.
  bloom:
    from: mid April
    to: mid May
    colour: white
    hue: white
- name: Malus domestica
  common_name: Apple
  order: Rosales
  garden_origin: >-
    domesticated 4,000–10,000 years ago from a wild apple of the Tian Shan mountains, in Central
    Asia
  inaturalist_taxon_id: 469472
  description: >-
    Apple seedlings don't come true: each is unlike its parents, so every one of the more than 7,500
    named apples is kept going by grafting. Travelling west along the Silk Road, the apple crossed
    so often with wild crabapples that modern apples are more closely related to the European crab
    apple than to the wild apple they came from.
- name: Malus floribunda
  common_name: Showy crabapple
  order: Rosales
  native_region: East Asia, especially Japan
  inaturalist_taxon_id: 165105
  description: >-
    Showy crabapple's botanical name, floribunda, means "flowering freely". It carries a gene for
    resistance to apple scab, a fungal disease, and apple breeders have used it to raise
    scab-resistant orchard apples. It may itself be a hybrid of two other East Asian crabapples,
    Malus toringo and M. baccata.
  bloom:
    from: mid April
    to: mid May
    colour: pink fading to white
    hue: pale pink
- name: Malus sylvestris
  common_name: European crab apple
  native_region: most of Europe, east to Turkey and the Caucasus
  inaturalist_taxon_id: 469472
  description: >-
    European crab apple's botanical name means "forest apple". Its fruit is spread mostly by cattle
    and horses, which took over the role of the now-extinct aurochs and wild horses; with fewer
    grazing animals in the countryside and frequent crossing with orchard apples, pure wild trees
    have become rare throughout its range.
- name: Metasequoia glyptostroboides
  common_name: Dawn redwood
  native_region: a few valleys in central China
  inaturalist_taxon_id: 69150
  description: >-
    This species was known only from fossils and thought to be extinct, until its rediscovery in
    China in 1944.
- name: Morus
  common_name: Mulberry
  order: Suliformes
  inaturalist_taxon_id: 56090
  description: This tree has only been identified to genus, not species.
- name: Morus alba
  common_name: White mulberry
  order: Rosales
  native_region: China and India
  inaturalist_taxon_id: 56090
  description: >-
    White mulberry leaves are the preferred food of silkworms, and the tree has been grown in China
    to raise them for more than 4,700 years. Its stamens fling out pollen like tiny catapults at
    about 610 km/h (380 mph), half the speed of sound, the fastest known movement in the plant
    kingdom.
- name: Nyssa sylvatica
  common_name: Black tupelo
  order: Cornales
  native_region: eastern North America, from southern Ontario to Florida and Texas, and Mexico
  inaturalist_taxon_id: 54802
  description: >-
    Black tupelo colours early in autumn, and its scarlet leaves are thought to signal its ripe
    fruit to migrating birds. The name tupelo comes from the Creek words ito, "tree", and opilwa,
    "swamp".
  wildlife:
    - who: [robins, thrushes, woodpeckers]
      what: eat its blue-black fruit in autumn
  cultivars:
    - name: Red Rage
      description: >-
        A black tupelo with glossy leaves and brilliant red autumn colour, selected for resistance to
        leaf spot.
- name: Other
  common_name: Other
- name: Oxydendrum arboreum
  common_name: Sourwood
  order: Ericales
  native_region: the eastern United States, mostly the Appalachians, from Pennsylvania to Florida
  inaturalist_taxon_id: 133354
  description: >-
    Sourwood is named for its acid-laden leaves, and Oxydendrum is Greek for "sour tree". Its
    flowers give a renowned honey and are made into sourwood jelly, and the Cherokee and Catawba
    made arrow shafts from its shoots. In autumn its leaves turn bright scarlet.
- name: Parrotia persica
  common_name: Persian ironwood
  order: Saxifragales
  native_region: the mountain forests of northern Iran and Azerbaijan, near the Caspian Sea
  inaturalist_taxon_id: 464251
  cultivars:
    - name: Ruby Vase
      description: >-
        An upright, vase-shaped selection of Persian ironwood, with reddish new leaves and red to
        orange autumn colour.
    - name: Vanessa
      description: >-
        A narrow, upright selection of Persian ironwood from the Netherlands, used where there's
        little room to spread.
  description: >-
    Persian ironwood is a relative of witch-hazel, named for its very hard wood. It's planted for its
    autumn colour, which runs from yellow through orange to red, and its patchwork, peeling bark.
- name: Paulownia tomentosa
  common_name: Princess tree
  order: Lamiales
  native_region: central and eastern China, and Korea
  inaturalist_taxon_id: 119792
  description: >-
    Princess tree is named after Anna Pavlovna of Russia, queen of the Netherlands in the 1840s. In
    Japan it is customary to plant one when a daughter is born and make its wood into a tansu chest
    for her wedding. Chinese porcelain exporters in the 1800s packed their wares in its seeds, which
    spilled along railway lines and helped it spread.
- name: Phellodendron amurense
  common_name: Amur cork tree
  order: Sapindales
  native_region: >-
    northeastern Asia: northern China, Korea, Japan and the Russian Far East
  inaturalist_taxon_id: 166636
  description: >-
    Amur cork tree bark is a major source of huáng bò, one of the 50 fundamental herbs of
    traditional Chinese medicine. A yellow dye from the bark was used across East Asia to colour
    paper for sutras, including the Diamond Sutra, because it protected the pages from insects. The
    Ainu people of Japan used its fruit as a painkiller.
- name: Picea
  common_name: Spruce
  order: Pinales
  inaturalist_taxon_id: 48734
  description: This tree has only been identified to genus, not species.
- name: Picea abies
  common_name: Norway spruce
  native_region: northern, central and eastern Europe, from Norway to Russia and the Alps
  inaturalist_taxon_id: 63567
  description: >-
    Norway spruce is a prized tonewood for violins, and Stradivari used it for his. Every year Oslo
    sends a Norway spruce to London's Trafalgar Square as a Christmas tree, in thanks for Britain's
    help in the Second World War.
- name: Picea engelmannii
  common_name: Engelmann spruce
  order: Pinales
  native_region: >-
    the mountains of western North America, from central British Columbia to Arizona and New Mexico
  inaturalist_taxon_id: 78582
  description: >-
    Engelmann spruce bark was peeled in large sheets from living trees, taking only part so the tree
    survived, to make canoes (Secwepemc and other Interior Salish peoples, Ktunaxa) and large
    barrel-shaped baskets for cooking berries and soaking skins (Secwepemc and other Interior
    Plateau peoples). Its roots were coiled into baskets (Tsilhqot’in and other Dene), a tea of its
    bark is a general medicine (Nlaka’pamux, Okanagan), and hunters and others wash with its
    branches for purification (Nlaka’pamux). Wood from slow-grown mountain trees is prized for the
    soundboards of guitars, violins and pianos.
  turner_pages: vol. 1, pp. 380, 396, 437, 548; vol. 2, pp. 184, 302
- name: Picea glauca
  common_name: White spruce
  order: Pinales
  native_region: >-
    the northern forests of Alaska and Canada, from the Arctic treeline south to the Great Lakes
  inaturalist_taxon_id: 117326
  description: >-
    White spruce is the northernmost tree in North America, reaching past 69°N in the Mackenzie
    River delta. Its crushed needles have a sharp smell that has earned it the names cat spruce and
    skunk spruce.
  wildlife:
    - who: [chickadees, nuthatches, pine siskins]
      what: eat its seeds
- name: Picea omorika
  common_name: Serbian spruce
  native_region: a small stretch of the Drina River valley, on the border of Serbia and Bosnia
  inaturalist_taxon_id: 135773
  description: >-
    Serbian spruce was discovered on Mount Tara in 1875 and named by the botanist Josif Pančić; in
    Serbian it is still called Pančić's spruce. Before the ice ages it grew across most of Europe.
    Its narrow, spire-like crown has made it a popular garden tree in northern Europe and North
    America.
- name: Picea orientalis
  common_name: Oriental spruce
  order: Pinales
  native_region: the Caucasus and northeastern Turkey, near the Black Sea
  inaturalist_taxon_id: 135802
  description: >-
    Oriental spruce has the shortest needles of any spruce, just 6–8 mm (about 1/4 in) long and
    glossy dark green, while its Himalayan relative, the morinda spruce, has the longest. Its young
    cones are green or red to purple, ripening dark brown within months. It is a popular tree for
    large gardens in northern Europe and the United States.
- name: Picea pungens
  common_name: Blue spruce
  native_region: the Rocky Mountains of the United States, from Wyoming to New Mexico
  inaturalist_taxon_id: 119092
  description: >-
    Blue spruce is the state tree of Colorado, and its blue-grey needles have made it a popular
    ornamental far beyond its native range.
- name: Picea sitchensis
  common_name: Sitka spruce
  order: Pinales
  native: true
  native_region: the Pacific coast of North America, from Alaska to northern California
  inaturalist_taxon_id: 68131
  description: >-
    Sitka spruce's sharp-needled branches are used to protect against illness (Central Coast Salish
    and others); after a death, the Klallam beat the bed, the walls and the arms of relatives with
    spruce branches to drive away any lingering sickness. Its roots were split and twined into
    baskets and fishing lines, its pitch sealed canoes, and its wood made bows, wedges and fish
    traps.
  turner_pages: vol. 1, pp. 340, 342, 344; vol. 2, pp. 302, 333
  wildlife:
    - who: [bald eagles, peregrine falcons]
      what: nest in it
    - who: [cavity-nesting birds]
      what: favour its dead snags
- name: Picea smithiana
  common_name: Morinda spruce
  order: Pinales
  native_region: the western Himalaya, from Afghanistan and Pakistan to India and central Nepal
  description: >-
    Morinda spruce has the longest needles of any spruce, 2.5–5 cm (1–2 in), and its branchlets hang
    down from level branches, which has made it a popular tree for large gardens in western Europe.
    The name morinda comes from its Nepali name, and smithiana honours James Edward Smith, the
    English botanist who founded the Linnean Society.
- name: Pinus
  common_name: Pine
  inaturalist_taxon_id: 52391
  description: This tree has only been identified to genus, not species.
- name: Pinus aristata
  common_name: Rocky Mountain bristlecone pine
  order: Pinales
  native_region: >-
    the high Rocky Mountains of Colorado and New Mexico, with one outlying group in Arizona
  inaturalist_taxon_id: 135774
  description: >-
    Rocky Mountain bristlecone pine is named for the bristle-like points on its cone scales. It can
    live for more than 2,400 years; the oldest in Colorado, on Black Mountain, has been dated to 442
    BCE. Its needles are flecked with white resin, which a botanist described as "dandruffy" and
    which is easily mistaken for scale insects.
- name: Pinus ayacahuite
  common_name: Mexican white pine
  order: Pinales
  native_region: the mountains of southern Mexico and Central America, south to Honduras
  inaturalist_taxon_id: 135746
  description: >-
    Mexican white pine has some of the longest cones that can be grown in many temperate gardens,
    slender and 15–40 cm (6–16 in) long. Although its wild range lies entirely in the tropics, south
    of the Tropic of Cancer, planted trees have survived temperatures near −30 °C (−22 °F) in
    Scotland and Pennsylvania.
- name: Pinus banksiana
  common_name: Jack pine
  order: Pinales
  native_region: >-
    most of Canada east of the Rockies, south into the northern United States from Minnesota to
    Maine
  inaturalist_taxon_id: 58724
  description: >-
    Jack pine's botanical name honours the English botanist Sir Joseph Banks. Many of its cones stay
    closed for years until the heat of a forest fire, 50 °C (122 °F) or more, opens them to reseed
    the burnt ground. Unusually for a pine, the cones point forward along the branch, sometimes
    curling around it.
- name: Pinus bungeana
  common_name: Lacebark pine
  order: Pinales
  native_region: the mountains of northern and central China
  notable: true
  inaturalist_taxon_id: 135808
  description: >-
    Lacebark pine is widely cultivated as an ornamental, especially for its attractive metallic bark,
    which flakes away in patches of white, grey and green.
- name: Pinus contorta
  common_name: Lodgepole pine
  native: true
  native_region: western North America, from Alaska and the Yukon to California and the Rockies
  inaturalist_taxon_id: 48934
  description: >-
    Shore pine, the coastal form of lodgepole pine, grows twisted and stunted on rocky shores and in
    bogs, which gave the species its name, contorta. Its pitch and inner bark were harvested a
    little at a time so the tree lived: pitch by coastal peoples such as the Haida and Gitxsan, and
    inner bark, for food, by interior peoples. Inland, lodgepole pine depends on fire, whose heat
    opens its cones to release the seeds.
  turner_pages: vol. 2, p. 184
- name: Pinus coulteri
  common_name: Coulter pine
  native_region: the coastal mountains of southern California and northern Mexico
  inaturalist_taxon_id: 67330
  description: >-
    Coulter pine has the heaviest cones of any pine, 20–40 cm (8–16 in) long and up to 5 kg (11 lb)
    when fresh. Locals call them "widowmakers", and people working in Coulter pine groves are
    advised to wear hard hats.
- name: Pinus densiflora
  common_name: Japanese red pine
  order: Pinales
  native_region: Japan, Korea, northeastern China and the far southeast of Russia
  inaturalist_taxon_id: 135811
  description: >-
    Japanese red pine is akamatsu in Japanese: aka, "red", probably for its orange-red bark, and
    matsu, "pine", which may come from matsu, "to wait", as the tree was believed to wait for the
    arrival of the gods. In northeastern China the matsutake mushroom depends on it, and its soft
    needles make it easy to shape as a miniature potted tree.
- name: Pinus flexilis
  common_name: Limber pine
  order: Pinales
  native_region: >-
    the mountains of western North America, from southeastern British Columbia and Alberta to
    northern Mexico
  inaturalist_taxon_id: 78585
  description: >-
    Limber pine is named for its pliant branches: both "limber" and the botanical name flexilis
    refer to them. It can live for thousands of years. One in Oregon's Eagle Cap Wilderness is over
    2,000 years old, and a tree at Whirlpool Point, beside Alberta's North Saskatchewan River, may
    be close to 3,000.
  wildlife:
    - who: [red squirrels]
      what: eat its seeds
    - who: [northern flickers]
      what: nest in it
- name: Pinus jeffreyi
  common_name: Jeffrey pine
  native_region: the mountains of California, southern Oregon, western Nevada and northern Mexico
  inaturalist_taxon_id: 48463
  description: >-
    Jeffrey pine's bark and crushed needles smell of vanilla, pineapple or, most often,
    butterscotch. Its resin yields heptane so pure that heptane was chosen as the zero point of the
    octane scale for petrol. Its cone prickles point inward, which gives the rhyme "gentle Jeffrey,
    prickly ponderosa".
- name: Pinus monticola
  common_name: Western white pine
  native: true
  native_region: >-
    the mountains of western North America, from British Columbia to California and the northern
    Rockies
  sencoten_name: ₭ÍYÁL¸EŚEȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#320.
  inaturalist_taxon_id: 68084
  description: >-
    Western white pine bark was peeled in sheets from living trees to make baskets and canoes
    (Ktunaxa, Lakes, Secwepemc). It is the state tree of Idaho. White pine blister rust, a fungus
    brought from Europe by accident in 1909, has killed an estimated 90% of the trees west of the
    Cascades.
  turner_pages: vol. 2, p. 184
- name: Pinus mugo
  common_name: Mugo pine
  native_region: >-
    the mountains of central and southern Europe, from the Pyrenees and Alps to the Balkans
  inaturalist_taxon_id: 135727
  description: >-
    Mugo pine's young cones and buds are made into a syrup, mugolio: they are left in the sun from
    spring into autumn to drip syrup, which is then boiled down with sugar. The misspelling "mugho",
    first printed in a prominent 18th-century encyclopedia, stayed in occasional use until about
    2020.
- name: Pinus nigra
  common_name: Austrian pine
  order: Pinales
  native_region: southern Europe, from Spain to Turkey, and North Africa
  inaturalist_taxon_id: 135790
  description: >-
    European black pine has several regional forms with their own names, including Austrian, Corsican
    and Crimean pine. Austrian pine tolerates wind, salt and poor soil, and has been widely planted as
    a windbreak and street tree.
- name: Pinus parviflora
  common_name: Japanese white pine
  order: Pinales
  native_region: Japan
  description: >-
    Japanese white pine is one of the most popular pines for bonsai. Its botanical name, parviflora,
    means "with small flowers". High in the mountains of northern Japan it sometimes crosses with a
    related alpine pine, Pinus pumila, and the hybrid is named after the Hakkōda Mountains, where it
    was first found.
- name: Pinus pinaster
  # Tree A296 has been misidentified as Aleppo pine (Pinus halepensis). For its identification see
  # naturevictoria.com/species/p-pinaster.html and conifers.org/pi/Pinus_pinaster.php.
  common_name: Maritime pine
  order: Pinales
  native_region: the western Mediterranean, in Spain, Portugal, France, Italy and North Africa
  notable: true
  description: >-
    Maritime pine makes up the Landes forest of southwest France, the largest planted maritime pine
    forest in Europe, much of it planted in the 1800s.
- name: Pinus ponderosa
  common_name: Ponderosa pine
  order: Pinales
  native_region: the mountains and dry interior of western North America, including southern British Columbia
  inaturalist_taxon_id: 48461
  description: >-
    Ponderosa pine is the most widely distributed pine in North America. David Douglas named it in
    1829 for its heavy wood. Mature trees have orange, jigsaw-puzzle bark that smells of vanilla when
    warmed by the sun.
  wildlife:
    - who: [quail]
      what: eat its seeds
    - who: [pileated woodpeckers]
      what: nest in it
- name: Pinus radiata
  common_name: Monterey pine
  order: Pinales
  native_region: >-
    three small areas of the central California coast, near Monterey, and two Mexican islands
  inaturalist_taxon_id: 53421
  description: >-
    Monterey pine has become one of the world's most important timber trees: it makes up 89% of New
    Zealand's plantation forests, and in 2001 it produced 95% of Chile's lumber. In its small wild
    range it is threatened by pitch canker, a fungal disease brought to California from the
    southeastern United States.
- name: Pinus sabiniana
  common_name: Grey pine
  native_region: California
  notable: true
  inaturalist_taxon_id: 58772
  description: >-
    Grey pine's cones are large and heavy, 0.3–0.7 kg (0.7–1.5 lb) when fresh, with each scale
    ending in a hooked woody spur. Its big, sweet seeds were an important food for some California
    Indigenous peoples, and the Ohlone chewed its pitch to treat rheumatism. Its botanical name
    honours Joseph Sabine, secretary of the Horticultural Society of London.
- name: Pinus strobus
  common_name: Eastern white pine
  order: Pinales
  native_region: >-
    eastern North America, from Newfoundland and Manitoba south through the Appalachians to Georgia
  inaturalist_taxon_id: 52391
  description: >-
    Eastern white pine is the Haudenosaunee "Tree of Peace", the central symbol of their
    confederation, and since 2017 it has appeared on the flag of Montreal. In the 1600s and 1700s
    tall white pines in the American colonies were marked with the Crown's broad arrow and reserved
    as masts for the Royal Navy. It is the provincial tree of Ontario.
  wildlife:
    - who: [crossbills, pine siskins, red squirrels]
      what: eat its seeds
- name: Pinus sylvestris
  common_name: Scots pine
  order: Pinales
  native_region: Europe and northern Asia, from Scotland and Spain to eastern Siberia
  inaturalist_taxon_id: 58722
  description: >-
    Scots pine was one of the first trees brought to North America, in about 1600, and from the
    1950s to the 1980s it was one of the most popular Christmas trees in the United States. In the
    coal mines of Flanders its timber was used to prop tunnels, because it cracked audibly before it
    gave way.
- name: Pinus thunbergiana
  common_name: Japanese black pine
  order: Pinales
  native_region: the coasts of Japan and South Korea
  inaturalist_taxon_id: 135655
  description: >-
    Japanese black pine is one of the classic bonsai trees, and in Japanese gardens it is pruned
    into sculpted shapes as niwaki. Its tolerance of salt and pollution has made it popular in
    gardens and along streets. In Japan it has become endangered since the accidental introduction
    of the North American pinewood nematode, a tiny worm that kills the trees.
- name: Pinus wallichiana
  common_name: Bhutan pine
  order: Pinales
  native_region: the Himalaya, from Afghanistan and Pakistan east to southwestern China
  notable: true
  inaturalist_taxon_id: 135668
  description: >-
    Bhutan pine's botanical name honours Nathaniel Wallich, the Danish botanist who first sent its
    seeds to England in 1827. Its needles are long and flexible, 12–18 cm (5–7 in), and often droop,
    and its slender cones grow up to 32 cm (13 in). It is planted in parks partly because it
    tolerates air pollution better than some other conifers.
- name: Pistacia chinensis
  common_name: Chinese pistache
  native_region: most of China, and Taiwan
  description: >-
    Chinese pistache is the most frost-hardy of the pistachio trees, surviving about −25 °C (−13
    °F), and is used as a rootstock for the edible pistachio, Pistacia vera. Male and female flowers
    grow on separate trees, and the female trees produce small red fruits that turn blue when ripe.
- name: Platanus × acerifolia
  common_name: London plane
  garden_origin: a hybrid of the oriental plane and American sycamore, which arose in Spain or England in the 1600s
  inaturalist_taxon_id: 897876
  description: >-
    London plane was discovered in the mid-1600s by the gardener John Tradescant the Younger,
    possibly at Vauxhall Gardens in London. It is one of the most efficient trees at removing fine
    particle pollution from city air.
- name: Platanus acerifolia
  common_name: Plane tree
  inaturalist_taxon_id: 897876
- name: Platanus occidentalis
  common_name: American sycamore
  order: Proteales
  native_region: >-
    the eastern and central United States, just reaching southern Ontario, Quebec and northeastern
    Mexico
  inaturalist_taxon_id: 49662
  description: >-
    American sycamore's stiff bark can't stretch as the trunk grows, so it flakes off in large
    pieces, leaving the trunk mottled grey, white and green. The 1792 agreement that founded the New
    York Stock Exchange is called the Buttonwood Agreement because it was signed under a buttonwood,
    or sycamore, on Wall Street.
  wildlife:
    - who: [barred owls]
      what: nest in the hollows of old trunks
- name: Platanus orientalis
  common_name: Oriental plane
  order: Proteales
  native_region: southeastern Europe and western Asia, from the Balkans to Iran
  inaturalist_taxon_id: 181682
  description: >-
    Oriental plane, the chenar, has been a central tree of Persian gardens, which are built around
    water and shade, since ancient times. Hippocrates is said to have taught medicine under an
    oriental plane on the island of Kos.
- name: Platycladus orientalis
  common_name: Chinese thuja
  native_region: northern China and Korea
  inaturalist_taxon_id: 135659
  description: >-
    Chinese thuja's wood is used in Buddhist temples, both for building and, chipped, as incense.
    Despite its other name, oriental thuja, it is only distantly related to the true thujas, with
    different cones and almost scentless leaves.
- name: Populus
  common_name: Poplar
  order: Malpighiales
  inaturalist_taxon_id: 54840
  description: This tree has only been identified to genus, not species.
- name: Populus alba
  common_name: White poplar
  order: Malpighiales
  native_region: >-
    southern and central Europe to Central Asia, and the Atlas Mountains of North Africa
  inaturalist_taxon_id: 47570
  description: >-
    White poplar was the usual wood for panel paintings in Italy through the Middle Ages and
    Renaissance, and the Mona Lisa is painted on poplar. In Roman myth the tree was sacred to
    Hercules, who bound a white poplar branch around his brow after defeating Cacus, and victorious
    soldiers later wore its garlands in imitation.
- name: Populus angustifolia
  common_name: Narrowleaf cottonwood
  order: Malpighiales
  native_region: >-
    the Rocky Mountains and nearby plains, from Alberta and Saskatchewan to northern Mexico
  inaturalist_taxon_id: 52130
  description: >-
    Narrowleaf cottonwood's sticky, gummy buds were chewed like gum by Native American peoples,
    including the Apache and Navajo. It crosses readily with other cottonwoods where their ranges
    meet, and one common hybrid was long described as a separate species until its hybrid origin was
    confirmed in the 1980s.
- name: Populus balsamifera
  common_name: Balsam poplar
  order: Malpighiales
  native: true
  native_region: >-
    northern North America, with its black cottonwood subspecies along the Pacific coast from Alaska
    to California
  inaturalist_taxon_id: 78699
  description: >-
    Most of Victoria's balsam poplars are black cottonwood (subspecies trichocarpa), one of the
    tallest broadleaf trees in western North America. The Squamish say that burning its bark brings
    a strong wind, and its Squamish name may come from a root meaning "fluttering". Each spring it
    releases its seeds on drifts of cottony fluff, and its sticky, fragrant buds give the balsam
    poplars their name.
  turner_pages: vol. 1, p. 186; vol. 2, p. 307
- name: Populus nigra
  common_name: Black poplar
  order: Malpighiales
  native_region: Europe, southwest and central Asia, and northwest Africa
  inaturalist_taxon_id: 47565
  description: >-
    Black poplar's best-known form is the narrow, columnar Lombardy poplar, a single male tree
    selected in Lombardy, northern Italy, in the 1600s and grown from cuttings ever since. In
    Britain the native black poplar is now one of the rarest trees, with about 7,000 known, of which
    only about 600 are confirmed female.
- name: Populus tremula
  common_name: Eurasian aspen
  order: Malpighiales
  native_region: Europe and northern Asia, from Iceland and Britain to Kamchatka and Japan
  inaturalist_taxon_id: 47571
  description: >-
    Eurasian aspen's leaves hang on long, flattened stalks that let them tremble in the slightest
    breeze, the source of its botanical name, tremula, and of the old name "langues de femmes"
    (women's tongues) recorded in Gerard's 17th-century Herball. Victoria's trees are 'Erecta', a
    narrow, columnar form with bright yellow autumn colour, known in North America as Swedish
    columnar aspen.
- name: Populus tremuloides
  common_name: Trembling aspen
  order: Malpighiales
  native: true
  native_region: northern North America, from Alaska to Newfoundland and south through the Rockies to Mexico
  inaturalist_taxon_id: 54840
  description: >-
    Trembling aspen bark is one of the ten barks in a W̱SÁNEĆ (Saanich) family medicine for
    tuberculosis. Aspen spreads by its roots into large groves of identical trees that share one
    root system.
  turner_pages: vol. 1, p. 462
  wildlife:
    - who: [quail]
      what: eat its buds in winter
- name: Prunus
  common_name: Plum / Cherry
  order: Rosales
  inaturalist_taxon_id: 54834
  description: This tree has only been identified to genus, not species.
- name: Prunus × blireiana
  common_name: Purple-leafed plum
  garden_origin: >-
    a hybrid of Japanese apricot and purple-leaved cherry plum, raised by the Lemoine nursery in
    Nancy, France, around 1905
  description: >-
    Purple-leafed plum has rich pink, double, slightly scented flowers in spring. It is named after
    the town of Bléré, near Tours in France.
  bloom:
    from: early March
    to: late March
    colour: pink
    hue: pink
    note: "Double flowers before its purple leaves come out."
- name: Prunus × yedoensis
  common_name: Yoshino cherry
  garden_origin: a Japanese hybrid, bred by gardeners in the village of Somei in Edo (now Tokyo) in the 1800s
  description: >-
    Yoshino cherry, Somei-Yoshino in Japan, is a cross between the Oshima cherry and the Edo higan.
    It gets its habit of blooming before the leaves open from Edo higan, and its fast growth and
    pale flowers from Oshima cherry. Every tree is a clone of a single original, propagated by
    grafting.
  bloom:
    from: mid March
    to: early April
    colour: white to pale pink
    hue: pale pink
    note: "The classic cloud of blossom; the trees flower all at once, before their leaves."
- name: Prunus accolade
  common_name: cherry plum
- name: Prunus armeniaca
  common_name: Apricot
  order: Rosales
  native_region: Central Asia and China; its exact wild range is uncertain after long cultivation
  inaturalist_taxon_id: 135331
  description: >-
    Apricot has been grown in Armenia since ancient times, for so long that it was once thought to
    come from there, which is how it got its botanical name, "Armenian plum". It is Armenia's
    national fruit, and its wood is carved into the duduk, a wind instrument also called the
    "apricot pipe".
- name: Prunus avium
  common_name: Wild cherry
  order: Rosales
  native_region: Europe and western Asia, from Britain and Norway to Morocco and northern Iran
  inaturalist_taxon_id: 61964
  description: >-
    Wild cherry's botanical name means "bird cherry". Birds eat the small cherries and pass the
    stones in their droppings, which is how it has spread wild in North America. Cultivated sweet
    cherries are selections of this species, and its stones have been found at Bronze Age
    settlements across Europe.
  bloom:
    from: early April
    to: late April
    colour: white
    hue: white
- name: Prunus cerasifera
  common_name: Cherry plum
  order: Rosales
  native_region: southeast Europe and western Asia, from the Balkans to Iran and Central Asia
  inaturalist_taxon_id: 55837
  bloom:
    from: mid February
    to: mid March
    colour: pink to white
    hue: pale pink
    varieties:
      Nigra: pink
      Thundercloud: pink
    note: "Usually the first big show of the year, on dark purple-leaved trees ('Nigra', 'Thundercloud')."
  cultivars:
    - name: Nigra
      description: >-
        A cherry plum with dark purple leaves and pink flowers, one of the first trees to bloom each
        year.
    - name: Thundercloud
      description: A cherry plum with deep purple leaves that keep their colour through summer, and pink flowers.
  description: >-
    Cherry plum is thought to be one of the parents of the cultivated plum, Prunus domestica. Most of
    Victoria's are purple-leaved cultivars such as 'Nigra' and 'Thundercloud', whose pink flowers are
    among the first blossoms of the year.
- name: Prunus cerasus
  common_name: Sour cherry
  order: Rosales
  native_region: much of Europe and southwest Asia
  inaturalist_taxon_id: 68763
  description: >-
    Sour cherry is thought to have begun as a natural hybrid between sweet cherry and Prunus
    fruticosa, a small shrubby cherry that gave it its compact size and tart fruit. A Morello type
    has been grown at Schaerbeek in Belgium since the 12th century, and its cherries are a defining
    ingredient of kriek, Belgium's cherry lambic beer.
  bloom:
    from: mid April
    to: early May
    colour: white
    hue: white
- name: Prunus domestica
  common_name: European plum
  order: Rosales
  garden_origin: a domesticated plum, thought to have arisen in western Asia around the Caucasus
  inaturalist_taxon_id: 63735
  description: >-
    European plum is thought to be a hybrid of blackthorn and cherry plum. It is the most commonly
    grown plum in Europe, and most prunes are made from its fruit.
  bloom:
    from: late March
    to: mid April
    colour: white
    hue: white
- name: Prunus dulcis
  common_name: Almond
  order: Rosales
  native_region: Iran and surrounding countries
  inaturalist_taxon_id: 69936
  description: >-
    Almond was one of the first fruit trees to be domesticated, because good trees can be raised
    from seed without grafting, and almonds were found in Tutankhamun's tomb, from about 1325 BCE.
    In the Bible, Aaron's rod brings forth almond flowers, and the cups of the menorah in the Temple
    were shaped like almond blossoms.
- name: Prunus emarginata
  common_name: Bitter cherry
  order: Rosales
  native: true
  sencoten_name: SȻEȾEṈIȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#379.
  native_region: western North America, from British Columbia to California and east to the Rockies
  inaturalist_taxon_id: 63905
  description: >-
    Bitter cherry bark is peeled in strips from living trees to decorate baskets, wrap tool joints
    and make cordage (Coast Salish and interior peoples), and it is one of the ten barks in a
    W̱SÁNEĆ (Saanich) family medicine for tuberculosis. Its bark is also used in poultices and
    infusions (Kwakwaka’wakw). As its name says, its cherries are too bitter for people to eat.
  wildlife:
    - who: [cedar waxwings]
      what: eat its cherries and spread the seeds
  bloom:
    from: mid April
    to: mid May
    colour: white
    hue: white
    note: "Victoria's native cherry; small flowers in flat clusters."
  turner_pages: vol. 1, pp. 343, 462; vol. 2, p. 189
- name: Prunus laurocerasus
  common_name: Cherry laurel
  order: Rosales
  native_region: the lands around the Black Sea, from the Balkans through Turkey to the Caucasus and northern Iran
  inaturalist_taxon_id: 61432
  description: >-
    Cherry laurel is widely planted for hedges, but birds eat its fruit and spread the seeds, and it
    has become invasive in the Pacific Northwest. Its leaves and seeds contain hydrogen cyanide.
- name: Prunus lusitanica
  common_name: Portugal laurel
  order: Rosales
  native_region: >-
    Spain, Portugal, southwestern France, Morocco, and the Azores, Canary Islands and Madeira
  inaturalist_taxon_id: 127529
  description: >-
    Portugal laurel is named after Lusitania, the Roman name for Portugal, and in the wild it is
    rare, growing mainly along mountain streams. Widely planted for hedges, it has escaped into
    natural areas on Vancouver Island, from Victoria to Parksville, because birds eat its small
    purple-black cherries and spread the seeds.
- name: Prunus pensylvanica
  common_name: Pin cherry
  order: Rosales
  native_region: >-
    much of Canada and the northern United States, from Newfoundland to British Columbia
  inaturalist_taxon_id: 54833
  description: >-
    Pin cherry's shiny, reddish outer bark peels away in strips in late spring without harming the
    tree, and is used to decorate coiled cedar-root baskets and the rims of birch-bark baskets
    (Interior Plateau peoples); Secwepemc elder Mary Thomas gathered it for her birch-bark baskets.
    Basket makers scrape the bark to bring out its varnished red sheen and dye some strips black for
    contrast. It is also called fire cherry: its seeds can lie in the soil for 50 years or more and
    sprout quickly after a fire.
  turner_pages: vol. 1, pp. 343, 353–354, 368, 386; vol. 2, p. 189
- name: Prunus persica
  common_name: Peach
  order: Rosales
  native_region: >-
    the region of Northwest China between the Tarim Basin and the north slopes of the Kunlun
    Mountains
  inaturalist_taxon_id: 78755
- name: Prunus sargentii
  common_name: Sargent's cherry
  order: Rosales
  native_region: northern Japan, Korea and Sakhalin
  inaturalist_taxon_id: 325895
  bloom:
    from: mid March
    to: early April
    colour: pink
    hue: pink
  cultivars:
    - name: Columnaris
      match: columnar
      description: >-
        An upright form of Sargent cherry, with single pink flowers in spring and orange-red autumn
        colour.
    - name: Rancho
      description: A narrow, upright Sargent cherry with single pink flowers, used along streets.
  description: >-
    Sargent's cherry is named for Charles Sprague Sargent, the first director of Harvard's Arnold
    Arboretum. It's one of the hardiest flowering cherries, with single pink flowers in spring and
    some of the best orange-red autumn colour of any cherry.
- name: Prunus serotina
  common_name: Black cherry
  order: Rosales
  native_region: North and Central America, from southern Canada to Guatemala
  inaturalist_taxon_id: 54834
  description: >-
    Black cherry is perhaps the premier cabinet timber of the United States, sold simply as "cherry"
    and prized for its strong orange tones. A scratched young twig smells of almonds, a sign of the
    cyanide compounds that make its wilted leaves poisonous to livestock. Its juice can be used to
    mix drinks, hence its other name, rum cherry.
- name: Prunus serrula
  common_name: Birch bark cherry
  order: Rosales
  native_region: the mountains of western China and Tibet
  inaturalist_taxon_id: 125742
  description: >-
    Birch bark cherry is grown for its glossy, coppery-red bark, which peels in thin bands.
- name: Prunus serrulata
  common_name: Japanese cherry
  order: Rosales
  native_region: Japan, Korea and China
  inaturalist_taxon_id: 125742
  bloom:
    from: early April
    to: early May
    colour: pink or white
    hue: pink
    varieties:
      Kwanzan: deep pink
      Royal Burgandy: deep pink
      Shirofugen: white
      Shirotae: white
      Amanogawa: pale pink
    note: "'Accolade' opens first; the deep pink, double 'Kwanzan' and white 'Shirofugen' are the late show."
  cultivars:
    - name: Kanzan
      match: kwanzan
      description: >-
        The most widely planted Japanese flowering cherry, with large, double, deep pink flowers in
        late April and a stiff, vase-shaped crown. Often sold as 'Kwanzan'.
    - name: Shirofugen
      description: >-
        One of the last cherries to flower, in May. Pink buds open to double white flowers that fade
        to pink, against bronze young leaves. The name refers to the bodhisattva Fugen.
    - name: Royal Burgundy
      match: royal burgandy
      description: A purple-leaved form of 'Kanzan', with the same double pink flowers set against dark foliage.
  description: >-
    Japan's ornamental cherries, the Sato-zakura group, were bred over centuries from the Oshima
    cherry and other wild species. Cherry blossom viewing, hanami, has been a Japanese custom for more
    than a thousand years.
- name: Prunus subhirtella
  common_name: Winter-flowering cherry
  order: Rosales
  garden_origin: a Japanese hybrid known only in gardens
  bloom:
    from: early November
    to: early April
    colour: pale pink to white
    hue: pale pink
    note: "Flowers on and off through mild winter spells, most heavily in March."
  description: >-
    Winter-flowering cherry is a hybrid of two Japanese cherries, the Edo higan (Prunus itosakura) and
    the Fuji cherry (Prunus incisa). Its 'Autumnalis' form flowers on and off through the winter
    whenever the weather is mild.
- name: Prunus virginiana
  common_name: Bitter-berry / chokecherry
  order: Rosales
  native_region: most of Canada, most of the United States, and northern Mexico
  inaturalist_taxon_id: 54835
- name: Prunus wadai
  common_name: Cherry blossom
  garden_origin: a hybrid of Chinese sour cherry and winter-flowering cherry, raised in Japan
- name: Prunus yedoensis
  common_name: cherry plum
- name: Pseudocydonia sinensis
  common_name: Chinese quince
  order: Rosales
  native_region: southern and eastern China
  inaturalist_taxon_id: 129657
  description: >-
    Chinese quince's large, hard fruit gives off an intense, sweet smell as it ripens in late
    autumn, and softens only after frost. In Korea it is made into preserves and mogwa-cha, quince
    tea, and in Haeju, North Korea, two trees planted in 1910 are national monuments.
- name: Pseudotsuga menziesii
  common_name: Douglas-fir
  order: Pinales
  native: true
  native_region: western North America, from central British Columbia to Mexico
  sencoten_name: JSȺ¸IȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#318.
  inaturalist_taxon_id: 48256
  description: >-
    Douglas-fir bark is one of the best fuels, and some Coast Salish names for the tree come from an
    old word for "wood, log, stick". Its boughs are used in sweat baths and for cleansing
    (Nlaka’pamux, Okanagan and others), and its wood made harpoon and spear shafts, dip-net poles
    and fish-barbecuing stakes. Despite its name it is not a true fir; the genus name Pseudotsuga
    means "false hemlock". Archibald Menzies first recorded it on Vancouver Island in 1791.
  turner_pages: vol. 1, pp. 340, 344, 351; vol. 2, p. 303
- name: Pyrus
  common_name: Callery Pear
  order: Rosales
  inaturalist_taxon_id: 119793
  description: This tree has only been identified to genus, not species.
- name: Pyrus calleryana
  common_name: Callery pear
  order: Rosales
  native_region: China, Korea, Taiwan and Japan
  inaturalist_taxon_id: 119793
  description: >-
    Callery pear's small, hard fruits soften after frost and are then eaten by birds, which spread
    the seeds in their droppings; that is how it has become invasive in much of the eastern United
    States. It is named after Joseph-Marie Callery, a missionary in China who sent specimens to
    Europe. Its spring flowers have a smell often compared to rotting fish.
  bloom:
    from: mid March
    to: early April
    colour: white
    hue: white
  cultivars:
    - name: Chanticleer
      match: chanticlear
      description: >-
        A narrow, pyramidal Callery pear with white flowers in early spring and red-purple autumn
        colour, widely planted as a street tree.
- name: Pyrus communis
  common_name: Common pear
  order: Rosales
  native_region: central and eastern Europe and western Asia
  inaturalist_taxon_id: 63951
  description: >-
    Common pear is the parent of almost all the orchard pears grown in Europe and North America, and
    nearly every European variety began as a chance seedling or selection in western Europe, mostly
    in France. The most widely grown, 'Bartlett', or 'Williams', makes up about three-quarters of US
    pear production. Fermented pear juice is perry.
- name: Pyrus kawakamii
  common_name: Evergreen pear
  order: Rosales
  inaturalist_taxon_id: 205897
- name: Pyrus salicifolia
  common_name: Callery Pear
  order: Rosales
  inaturalist_taxon_id: 425871
- name: Quercus
  common_name: Oak
  order: Fagales
  inaturalist_taxon_id: 49005
  description: This tree has only been identified to genus, not species.
- name: Quercus agrifolia
  common_name: Coast live oak
  order: Fagales
  native_region: California and northern Baja California, Mexico, west of the Sierra Nevada
  inaturalist_taxon_id: 47850
  description: >-
    Coast live oak gave its Spanish name, encino, to many places in California, including Encino in
    Los Angeles and Encinitas, and Oakland is named after the Encinal del Temescal, the oak grove on
    its site. Its acorns were an important food for more than half of California's Indigenous
    peoples, and many still gather them, especially for special events.
- name: Quercus coccinea
  # Can be mistaken for pin oak: scarlet oak's leaf sinuses are C-shaped (pin oak's are U-shaped), and
  # its acorns are half covered by a deep cap.
  common_name: Scarlet oak
  native_region: the central and eastern United States
  inaturalist_taxon_id: 54784
  description: >-
    Scarlet oak is named for its brilliant scarlet autumn colour, and is the official tree of
    Washington, D.C.
- name: Quercus dentata
  common_name: Daimyo oak
  order: Fagales
  native_region: East Asia, including China, Japan, Korea, Taiwan and the Russian Far East
  inaturalist_taxon_id: 53640
  description: >-
    Daimyo oak has some of the largest leaves of any oak, up to 40 cm (16 in) long, and the dead
    leaves often hang on through winter. In Japan its leaves wrap the rice cakes called kashiwa
    mochi, after its Japanese name, and in Korea its acorns have been eaten since the Three Kingdoms
    period, notably as dotorimuk, an acorn jelly.
- name: Quercus frainetto
  common_name: Hungarian oak
  order: Fagales
  native_region: southeastern Europe, mainly the Balkans, and Turkey
  inaturalist_taxon_id: 461386
  description: >-
    Hungarian oak got its English name when the Kingdom of Hungary ruled much of the Balkans, the
    heart of its range. It is now very rare in Hungary itself, because it cannot tolerate lime in
    the soil, and most Hungarian soils are rich in lime.
- name: Quercus gambelii
  common_name: Gambel oak
  order: Fagales
  native_region: >-
    the foothills of the southern Rocky Mountains and US Southwest, into northwestern Mexico
  inaturalist_taxon_id: 116377
  description: >-
    Gambel oak is named after the American naturalist William Gambel (1821–1849). From vast
    underground root structures called lignotubers it sends up sprouts that form thickets across
    whole mountainsides, and after a fire it quickly grows back from them. Its acorns were a
    reliable food for Native Americans.
- name: Quercus garryana
  common_name: Garry oak
  order: Fagales
  native: true
  native_region: the Pacific coast, from southwestern British Columbia to southern California
  sencoten_name: ĆEṈ¸IȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#332.1.
  inaturalist_taxon_id: 68632
  description: >-
    Victoria's Garry oak meadows are the product of centuries, probably millennia, of light burning
    by the local Coast Salish peoples, which kept the land open and productive for camas and other
    food plants. Camas bulbs were a staple, harvested from family-owned plots. Younger Hul’qumi’num
    hunters left the open oak prairies, which were easier to walk, to the older hunters. Garry oak
    is the only native oak in British Columbia, and is named after Nicholas Garry, deputy governor
    of the Hudson's Bay Company.
  turner_pages: vol. 2, pp. 70, 149, 189
- name: Quercus ilex
  common_name: Holm oak
  order: Fagales
  native_region: >-
    the northern Mediterranean coast from Turkey to Spain, and the Atlas Mountains of North Africa
  inaturalist_taxon_id: 82946
  description: >-
    Holm oak is named for its holly-like leaves: holm is an old name for holly, and ilex, the
    classical Latin name for this oak, was later borrowed by botanists for the hollies. In Spain and
    Portugal its acorns are fed to the pigs raised for ibérico ham, and it is one of the three trees
    most used in truffle orchards.
  wildlife:
    - who: [bees]
      what: gather pollen from its yellow catkins in early spring
- name: Quercus lobata
  common_name: Valley oak
  order: Fagales
  native_region: California only, in its interior valleys and foothills
  inaturalist_taxon_id: 49011
  description: >-
    Valley oak is among the largest North American oaks. In 1792 the explorer George Vancouver,
    travelling through California's Santa Clara Valley, compared its spreading valley oaks to an
    English park planted with old oaks. Much of its habitat has since become farmland and towns, and
    it is now listed as near threatened.
  wildlife:
    - who: [black-tailed deer]
      what: eat its acorns
- name: Quercus macrocarpa
  common_name: Bur oak
  order: Fagales
  native_region: >-
    central and eastern North America, from Alberta and New Brunswick south to New Mexico
  inaturalist_taxon_id: 54781
  description: >-
    Bur oak has the largest acorns of any North American oak, which gives it its botanical name,
    macrocarpa, from the Greek for "large fruit". Their deep cups have overlapping scales and often
    a fringed rim, the source of its other name, mossycup oak. Its thick bark lets older trees
    survive the fires of the Midwest's oak savannas.
- name: Quercus palustris
  common_name: Pin oak
  order: Fagales
  native_region: the eastern and central United States and the southern tip of Ontario
  inaturalist_taxon_id: 54785
  cultivars:
    - name: Green Pillar
      description: A narrow, columnar pin oak for tight spaces.
  description: >-
    Pin oak is one of the most planted oaks in North America, because it transplants easily, grows
    quickly and tolerates pollution. Its lower branches droop downward, and its dead leaves often hang
    on through winter.
- name: Quercus phellos
  common_name: Willow oak
  order: Fagales
  native_region: >-
    the eastern and south-central United States, from New York to northern Florida and eastern Texas
  inaturalist_taxon_id: 119983
  description: >-
    Willow oak is named for its narrow, untoothed leaves, which look more like a willow's than an
    oak's. It tolerates pollution, storms and flooding, and is widely planted along streets in
    cities of the southern United States such as Raleigh and Atlanta, though it often grows larger
    than planners expect and cracks sidewalks.
  wildlife:
    - who: [eastern grey squirrels]
      what: eat its acorns
- name: Quercus phillyraeoides
  common_name: Ubame oak
  order: Fagales
  native_region: southern China and Japan
  inaturalist_taxon_id: 428732
  description: >-
    Ubame oak is the wood used in Japan to make binchōtan, a traditional charcoal that is also a
    form of activated carbon. The origin of its Japanese name, ubamegashi, is uncertain: one theory
    reads it as "old woman's eyes", after the yellow-brown new leaves, but most think the "me" means
    new buds or leaves.
- name: Quercus prinus
  common_name: Oak
  order: Fagales
  inaturalist_taxon_id: 128686
- name: Quercus robur
  common_name: English oak
  order: Fagales
  native_region: most of Europe, from Ireland and Spain to Russia and the Caucasus
  inaturalist_taxon_id: 56133
  cultivars:
    - name: Fastigiata
      match: columnar
      description: Cypress oak, a columnar form of English oak.
  description: >-
    English oak supports more wildlife than almost any other European tree, from insects to the birds
    and mammals that eat its acorns. It can live for more than 500 years, and some trees are believed
    to be over 1,000 years old. The name pedunculate oak refers to its acorns, which grow on long
    stalks.
- name: Quercus rubra
  common_name: Northern red oak
  order: Fagales
  native_region: eastern North America, from southern Quebec and Ontario to Georgia and Oklahoma
  inaturalist_taxon_id: 49005
  description: >-
    Northern red oak is one of the most important timber oaks in North America, and the provincial
    tree of Prince Edward Island. It's one of the fastest-growing oaks, and like other red oaks its
    acorns take two years to ripen.
- name: Quercus velutina
  common_name: Black oak
  order: Fagales
  native_region: eastern and central North America, from Maine and southern Ontario to Texas
  inaturalist_taxon_id: 49006
  description: >-
    Black oak's inner bark holds a yellow-orange pigment, quercitron, which was once exported to
    Europe as a textile dye and gave the tree its old name, yellow oak. Its botanical name,
    velutina, means "velvety", and its buds are velvety with white hairs. It crosses readily with
    other red oaks and is a parent of at least a dozen named hybrids.
- name: Quercus virginiana
  common_name: Southern live oak
  order: Fagales
  native_region: >-
    the coastal plain of the southeastern United States, from Virginia to Florida and Texas
  inaturalist_taxon_id: 49013
  description: >-
    Southern live oak was the preferred timber for the frames of wooden ships. USS Constitution's
    frame was built from live oak cut on St. Simons Island, Georgia, and its dense wood withstood
    cannon fire, earning the ship the nickname "Old Ironsides". It has been the state tree of
    Georgia since 1937.
- name: Rhamnus purshiana
  common_name: Cascara
  order: Rosales
  native: true
  native_region: >-
    western North America, from southern British Columbia to California and inland to Montana
  inaturalist_taxon_id: 77156
  description: >-
    Cascara bark is one of the ten barks in a W̱SÁNEĆ (Saanich) family medicine for tuberculosis,
    and an infusion is drunk as a laxative and a general tonic; its Ditidaht name means "laxative
    medicine". The bark is taken in strips so the tree lives, and the tree is spoken to and asked
    permission first (coast and interior peoples). In the early 1900s many Indigenous harvesters
    sold the bark to drug companies, for about 20 cents a pound in the 1930s; Hul’qumi’num elder
    Luschiim (Arvid Charlie) paid for his hunting ammunition this way as a child.
  turner_pages: vol. 1, pp. 130, 248, 420–421, 462; vol. 2, pp. 187, 305
- name: Rhododendron
  order: Ericales
  description: This tree has only been identified to genus, not species.
- name: Rhus
  common_name: Sumac
  order: Sapindales
  inaturalist_taxon_id: 58732
  description: This tree has only been identified to genus, not species.
- name: Rhus glabra
  common_name: Smooth sumac
  order: Sapindales
  native_region: >-
    southern Canada, from Quebec to British Columbia, and south through the US to northeastern
    Mexico
  inaturalist_taxon_id: 54764
  description: >-
    Smooth sumac leaves were smoked with kinnikinnick and native tobacco in some Secwepemc
    ceremonies, and interior peoples also smoked its inner bark; its Secwepemc name is related to an
    ancient Salish word for tobacco. In 2020, residue in an ancient pipe dug up in central
    Washington showed it had been smoked there too. The Stl’atl’imx say it should not be used to
    cover berries in a basket, or it will "steal" some of them.
  turner_pages: vol. 1, pp. 182, 451; vol. 2, pp. 308, 319, 335
  wildlife:
    - who: [deer]
      what: browse its twigs and fruit
- name: Rhus hirta
  common_name: Staghorn sumac
  order: Sapindales
  native_region: >-
    southeastern Canada and the northeastern and midwestern United States, south in the Appalachians
  inaturalist_taxon_id: 167829
  description: >-
    Staghorn sumac is named for its shoots, which are densely covered in rust-coloured hairs like a
    stag's antlers in velvet; Linnaeus described its branches as "hairy like antlers in velvet". Its
    red fruit clusters stay on through winter, and the fruit can be soaked in cold water to make a
    lemonade-like drink, sumac-ade.
- name: Robinia pseudoacacia
  common_name: Black locust
  order: Fabales
  native_region: the Appalachian and Ozark mountains of the eastern United States
  inaturalist_taxon_id: 56088
  description: >-
    Black locust is a legume, so it fixes nitrogen and grows well on poor ground. Its other name,
    false acacia, is a translation of pseudoacacia. The rot-resistant wood has long been used for
    fence posts, and its fragrant white flowers make a prized honey, sold in Europe as acacia honey.
    It's invasive in many regions.
- name: Robinia x
  common_name: Idaho locust
- name: Salix
  common_name: Willow
  order: Malpighiales
  inaturalist_taxon_id: 54847
  description: This tree has only been identified to genus, not species.
- name: Salix × sepulcralis 'Chrysocoma'
  common_name: Golden weeping willow
  garden_origin: a garden hybrid of white willow and Peking willow, raised in Europe in the 1800s
  description: >-
    Golden weeping willow gets its hardiness and golden shoots from golden white willow, and its
    strongly weeping habit from Chinese weeping willow.
- name: Salix alba
  common_name: White willow
  order: Malpighiales
  native_region: Europe and western and Central Asia
  inaturalist_taxon_id: 54841
  description: >-
    White willow is named for the silky white hairs under its leaves. One form, the cricket-bat
    willow, is grown in Britain for cricket bats, as its wood is tough and light and does not
    splinter easily. In 1763 Edward Stone of Oxfordshire found its bitter bark could treat fevers,
    and used it on about fifty people.
- name: Salix babylonica
  common_name: Weeping willow
  native_region: northern China
  inaturalist_taxon_id: 58316
  description: >-
    Weeping willow's name babylonica comes from Linnaeus's mistaken belief that this Chinese willow
    was the one by the rivers of Babylon in Psalm 137.
- name: Salix caprea
  common_name: Goat willow
  order: Malpighiales
  native_region: Europe and western and central Asia
  inaturalist_taxon_id: 55846
  description: >-
    Goat willow probably gets its name from the first known picture of it, in Hieronymus Bock's
    herbal of 1546, which shows a goat browsing on it. Its silky catkins are the pussy willows of
    early spring, and in countries from Germany to Ukraine and Finland the just-opened catkins are
    carried in place of olive branches on Palm Sunday.
  wildlife:
    - who: [moth and butterfly caterpillars]
      what: feed on its leaves
- name: Salix matsudana
  common_name: Chinese willow
  order: Malpighiales
  native_region: northern China
  inaturalist_taxon_id: 127243
  description: >-
    Chinese willow, or Peking willow, is grown in northern China for timber, as an ornamental and in
    shelterbelts, notably around the oases of the Gobi Desert, where it shields farmland from desert
    winds. Many botanists now count it as part of the weeping willow, Salix babylonica, since the
    only reported difference is an extra nectar gland in each female flower.
- name: Salix nigra
  common_name: Black willow
  native_region: >-
    much of North America, from New Brunswick and southern Ontario to Florida, Texas and California
  inaturalist_taxon_id: 54847
  description: >-
    Black willow is the largest North American willow, and the only willow native to the United
    States that is used for timber. Its light wood keeps its shape and doesn't splinter easily, so
    it was once made into artificial limbs, and its very bitter roots were used in place of quinine.
- name: Salix scouleriana
  common_name: Scouler's willow
  order: Malpighiales
  native: true
  native_region: western North America, from Alaska to New Mexico
  sencoten_name: SX̱ELE¸IȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#332.
  inaturalist_taxon_id: 71076
  description: >-
    Straits Salish peoples cut willow bark and stems from living plants for cordage and netting,
    leaving them to regrow; the W̱SÁNEĆ word for willow means "reefnet plant", after the willow-bark
    reefnets that are a Straits Salish specialty. The Secwepemc used its wood to smoke fish and
    build weirs, and its inner bark for lashing, sewing and cordage. Its catkins give bees pollen
    and nectar in early spring.
  turner_pages: vol. 1, pp. 131, 399; vol. 2, p. 191
- name: Salix sitchensis
  common_name: Sitka willow
  native: true
  native_region: western North America, from Alaska to northern California and inland to Montana
  inaturalist_taxon_id: 61100
  description: >-
    The W̱SÁNEĆ (Saanich) word for willow means "reefnet plant": Straits Salish reefnets, said to
    have been given by Xals, the Creator, were made from willow bark, mostly Pacific willow's.
    Coastal peoples also twisted Sitka willow bark into bowstrings, and in the interior its branches
    and inner bark were used to build fish weirs and traps. It is named after Sitka, Alaska, where
    it was first collected.
  turner_pages: vol. 1, pp. 131, 368, 370, 399
- name: Sapindus drummondii
  common_name: Western soapberry
  order: Sapindales
  native_region: the southern United States, from Arizona and Colorado to Louisiana
  inaturalist_taxon_id: 286324
  description: >-
    Soapberries take their genus name, Sapindus, from the Latin for "Indian soap", because their
    fruit lathers in water and has long been used for washing. This species was once lumped with
    another soapberry, S. saponaria, but is now accepted as a species of its own.
- name: Sciadopitys verticillata
  common_name: Japanese umbrella-pine
  order: Pinales
  native_region: Japan
  inaturalist_taxon_id: 129057
  description: >-
    Japanese umbrella-pine is named for its glossy "needles", which are really flattened stems, set
    in umbrella-like whorls at the ends of the branches. It is a living fossil, the only surviving
    member of its family, and in Japan, where it is called kōyamaki, a stylized image of the tree is
    the crest of the Akishino branch of the Imperial Family.
- name: Sequoia sempervirens
  common_name: Coast redwood
  order: Pinales
  native_region: a narrow strip of coastal California and southwestern Oregon
  inaturalist_taxon_id: 47372
  description: >-
    Coast redwoods are the tallest trees on Earth, led by one named Hyperion at 116 m (381 ft). A
    2022 Canadian Forest Service paper proposed that Vancouver Island already offers "narrow strips
    of optimal habitat" for the species, which may have been kept from spreading north by a lack of
    lowland routes through Oregon's Coast Range.
  wildlife:
    - who: [black-tailed deer]
      what: eat its sprouts
- name: Sequoiadendron giganteum
  common_name: Giant sequoia
  order: Pinales
  native_region: about 70 groves on the western slopes of California's Sierra Nevada
  inaturalist_taxon_id: 59567
  description: >-
    Giant sequoias are the most massive trees on Earth. The genus is named in honour of Sequoyah
    (1767–1843), the Cherokee scholar who created the Cherokee syllabary. Their thick bark resists
    fire, and their cones open after a fire to release seeds.
- name: Sorbus
  common_name: Mountain Ash
  order: Rosales
  inaturalist_taxon_id: 56063
  description: This tree has only been identified to genus, not species.
- name: Sorbus americana
  common_name: American mountain-ash
  order: Rosales
  native_region: >-
    eastern North America, from Minnesota and Newfoundland south along the Appalachians to Georgia
  inaturalist_taxon_id: 54265
  description: >-
    American mountain-ash's bright red berries ripen in October and stay on the tree all winter;
    after the first winter freeze they can be eaten raw or cooked, and they have been made into pies
    and jelly. Like the European mountain-ash, it is also called rowan, and it grows largest on the
    northern shores of Lakes Huron and Superior.
  wildlife:
    - who: [robins, thrushes, waxwings, jays, squirrels]
      what: eat its berries
- name: Sorbus aria
  common_name: Whitebeam
  order: Rosales
  native_region: most of Europe, northwest Africa, eastern Turkey and the Caucasus
  inaturalist_taxon_id: 61522
  description: >-
    Whitebeam takes its name from the almost-white undersides of its leaves; "beam" is an old
    English word for a tree. Its scarlet berries are edible only when overripe, or bletted.
    Botanists now place the whitebeams in a genus of their own, Aria, apart from the rowans of
    Sorbus, so this tree is also listed as Aria edulis.
- name: Sorbus aucuparia
  common_name: European mountain-ash
  order: Rosales
  native_region: most of Europe and northern Asia, and the mountains of North Africa
  inaturalist_taxon_id: 56063
  description: >-
    European mountain-ash, also called rowan, takes its species name, aucuparia, "bird-catching",
    from fowlers who once used its berries as bait. In Scotland, rowan boughs were taken into cattle
    byres in May, and rowans planted in pastures, to protect livestock from evil. Despite the name
    mountain-ash, it isn't related to true ashes; only its leaves look alike.
  wildlife:
    - who: [thrushes, waxwings]
      what: eat its berries from late summer and spread the seeds
- name: Sorbus hupehensis
  common_name: Hubei rowan
  order: Rosales
  native_region: central and western China
  inaturalist_taxon_id: 484168
  description: >-
    Hubei rowan is named after Hubei, a province of central China once spelled Hupeh. It is grown
    for its pink to white berries, which ripen in late autumn as its leaves turn orange and red. In
    gardens it is often confused with its relative Sorbus oligodonta, to which the popular 'Pink
    Pagoda', commonly cited as Hubei rowan, actually belongs.
- name: Sorbus intermedia
  common_name: Swedish whitebeam
  order: Rosales
  native_region: southern Sweden and the Baltic coast
  inaturalist_taxon_id: 908314
  description: >-
    Swedish whitebeam, now classified as Hedlundia intermedia, is planted as a street tree for its
    tolerance of wind and poor soil, with white flowers in spring and orange-red berries in autumn.
  wildlife:
    - who: [thrushes, waxwings]
      what: eat its berries and spread the seeds
- name: Sorbus x
  common_name: German service-tree
  native_region: a few scattered sites across Europe, from Ireland to Romania, and in Turkey
  description: >-
    German service-tree is a natural hybrid of rowan and whitebeam that arises where the two grow
    together, and it also sets a little fertile seed of its own. Its leaves are part rowan, part
    whitebeam: lobed and grey-hairy underneath, with the lowest pairs of lobes split off as separate
    leaflets.
- name: Stewartia monadelpha
  common_name: Orangebark stewartia
  order: Ericales
  native_region: the cool mountain forests of central and southern Japan
  inaturalist_taxon_id: 452251
  description: >-
    Orangebark stewartia is named for its orange to cinnamon-brown bark. It is related to camellias,
    and its cupped white flowers with yellow stamens look like theirs, which explains its other
    name, deciduous camellia. The genus honours John Stuart, an 18th-century Scottish botanist.
- name: Stewartia pseudocamellia
  common_name: Japanese stewartia
  native_region: the mountains of southern Japan and South Korea
  inaturalist_taxon_id: 133373
  description: >-
    Japanese stewartia's white flowers look like a camellia's, which gives it both its botanical
    name, pseudocamellia, "false camellia", and its Japanese one, natsutsubaki, "summer camellia".
- name: Styrax japonicus
  common_name: Japanese snowbell
  order: Ericales
  native_region: Japan, Korea and southern China
  inaturalist_taxon_id: 128570
  description: >-
    Japanese snowbell's Japanese name, egonoki, comes from egui, a word for a harsh, bitter taste,
    because its olive-like fruit irritates the tongue and throat. The fruit's saponins have been
    used to make soap and to stun fish so they are easier to catch, and the hard wood was made into
    umbrella ribs and pieces for shogi, a Japanese board game.
- name: Styrax obassia
  common_name: Fragrant snowbell
  order: Ericales
  native_region: eastern China, Korea and Japan
  inaturalist_taxon_id: 452210
  description: >-
    Fragrant snowbell is grown in gardens as an ornamental. Its species name is sometimes spelled
    obassis, but obassia is the original; botanists have even disagreed over whether the genus name
    Styrax is masculine, feminine or neuter, which changes how its species names end.
- name: Styrax spp
  common_name: Snowbell
  description: This tree has only been identified to genus, not species.
- name: Syringa
  common_name: Lilac
  order: Lamiales
  inaturalist_taxon_id: 83072
  description: This tree has only been identified to genus, not species.
- name: Syringa reticulata
  common_name: Japanese tree lilac
  order: Lamiales
  native_region: Japan, northern China, Korea and the Russian Far East
  inaturalist_taxon_id: 135416
  description: >-
    Japanese tree lilac is the largest lilac and the only one that regularly grows as a small tree
    rather than a shrub. Its creamy-white flowers smell of honey and privet rather than of common
    lilac, and its tolerance of dry, alkaline soil and road salt has made it a common street tree
    across North America.
  cultivars:
    - name: Ivory Silk
      match: ivory
      description: >-
        A compact Japanese tree lilac with large plumes of creamy white flowers in June, later than
        other lilacs.
- name: Syringa vulgaris
  common_name: Common lilac
  order: Lamiales
  native_region: the rocky hills of the southern Balkans, in Serbia, North Macedonia and Bulgaria
  inaturalist_taxon_id: 83072
  description: >-
    Common lilac reached northern European gardens from the gardens of the Ottoman Empire: the Holy
    Roman Emperor's ambassador to the Ottomans, Ogier Ghiselin de Busbecq, is credited with sending
    cuttings to the botanist Carolus Clusius about 1562. It is the state flower of New Hampshire,
    and Isabella Preston bred hardier, later-flowering hybrids from it for Canadian gardens.
- name: Taxodium distichum
  common_name: Bald cypress
  native_region: the swamps and rivers of the southeastern United States, from Delaware to Texas
  inaturalist_taxon_id: 49666
  description: >-
    Bald cypress trees are deciduous (not evergreen) and when growing in swamps have a peculiarity
    of growth called cypress knees - woody projections from the root system project above the ground
    or water. It is still unknown what purpose these serve.
- name: Taxus
  common_name: Yew
  order: Pinales
  inaturalist_taxon_id: 47553
  description: This tree has only been identified to genus, not species.
- name: Taxus baccata
  common_name: English yew
  native_region: most of Europe, North Africa and southwest Asia, east to northern Iran
  inaturalist_taxon_id: 47553
  description: >-
    English yew's red, berry-like arils are eaten by birds, which pass the hard seeds unharmed.
    Every other part of the tree is poisonous. Yew wood was prized for English longbows, and the
    genus name, Taxus, may come from the Greek toxon, "bow".
- name: Taxus brevifolia
  common_name: Pacific yew
  native: true
  native_region: >-
    the Pacific Northwest, from southeast Alaska to northern California and inland to Idaho and
    Montana
  sencoten_name: ṮEṈ¸KIȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#331.
  inaturalist_taxon_id: 55209
  description: >-
    Pacific yew's Quw’utsun’ (Halkomelem) name means "bow tree". Wood for bows and other tools was
    cut from standing, living trees, a practice called "begging from" the tree (Halkomelem,
    Kwakwaka’wakw and others), and the tree was spoken to before a piece was taken (Kwakwaka’wakw).
    Its tough wood also made wedges, digging sticks, clubs, fishhooks and halibut gear; yew wedges
    about 3,000 years old have been found at a Musqueam village site.
  turner_pages: vol. 1, pp. 340, 405, 481; vol. 2, pp. 184, 303
- name: Taxus cuspidata
  common_name: Japanese yew
  order: Pinales
  native_region: Japan, Korea, northeastern China and the Russian Far East
  inaturalist_taxon_id: 133386
  description: >-
    Japanese yew is called ichi'i, "first rank", in Japan, because courtiers of the first rank
    carried ceremonial sceptres, called shaku, made of its wood. A tree in Tottori known as the Yew
    of Mount Sentsū is estimated to be 2,000 years old. Every part except the red flesh around the
    seed is poisonous.
- name: Taxus x
  common_name: Hybrid yew
  order: Pinales
  garden_origin: >-
    a hybrid of English and Japanese yews, first raised in Massachusetts in the early 1900s
  description: >-
    Hybrid yew, also called Anglojap yew, was first raised by the horticulturist T. D. Hatfield. It
    grows slowly and is not harmed by frequent clipping, which makes it a popular hedge and a good
    subject for bonsai. Like all yews, its needles, branches and seeds contain taxines, which are
    toxic to the heart.
- name: Thuja occidentalis
  common_name: Northern white-cedar
  order: Pinales
  native_region: eastern Canada and the northeastern United States, from Manitoba to Nova Scotia
  inaturalist_taxon_id: 54037
  description: >-
    Northern white-cedar is honoured in Ojibwe culture as Nookomis Giizhik, Grandmother Cedar, and
    is one of the four plants of the medicine wheel. Its foliage is rich in vitamin C, and it is
    believed to be the annedda that the St. Lawrence Iroquoians used to cure Jacques Cartier's crew
    of scurvy in the winter of 1535–36. Its other name, arborvitae, is Latin for "tree of life".
- name: Thuja plicata
  common_name: Western redcedar
  native: true
  native_region: the Pacific Northwest, from southeast Alaska to northern California and inland to the Rockies
  sencoten_name: XPȺ¸
  sencoten_url: http://saanich.montler.net/WordList/plants.html#321.
  inaturalist_taxon_id: 48252
  description: >-
    Western redcedar boughs are used as ceremonial scrubbers (W̱SÁNEĆ), and to sweep a house after a
    death, with their smoke keeping ghosts away (W̱SÁNEĆ, western Washington peoples). The Straits
    Salish laid their first salmon on cedar boughs. Its straight-grained wood builds houses, canoes
    and totem poles, its bark is woven into clothing, mats and rope, and Sechelt women are renowned
    for coiled cedar-root baskets. It is not a true cedar but a member of the cypress family.
  turner_pages: vol. 2, pp. 128, 303, 329
- name: Thujopsis dolabrata
  common_name: Hiba
  order: Pinales
  native_region: Japan
  inaturalist_taxon_id: 135553
  description: >-
    Hiba is called asunaro in Japan, popularly read as "tomorrow it will become a hinoki", because
    it looks like a small hinoki cypress. It is commonly planted around temples there, and in
    gardens in Europe and North America.
- name: Tilia americana
  common_name: American basswood
  native_region: eastern North America, from Manitoba and New Brunswick south to the Carolinas and Oklahoma
  inaturalist_taxon_id: 54854
  description: >-
    American basswood's flowers provide abundant nectar for bees and other insects, and its seeds
    are eaten by chipmunks, mice and squirrels.
- name: Tilia cordata
  common_name: Littleleaf linden
  order: Malvales
  native_region: most of Europe, from Britain to the Caucasus and western Siberia
  inaturalist_taxon_id: 132600
  description: >-
    Littleleaf linden, called small-leaved lime in Britain, was much planted for avenues in 17th-
    and early 18th-century landscapes, and some lime trees in Germany are said to be over 1,000
    years old.
- name: Tilia tomentosa
  common_name: Silver linden
  order: Malvales
  native_region: southeastern Europe and western Turkey, from Romania through the Balkans
  inaturalist_taxon_id: 143800
  description: >-
    Silver linden's best-known tree, in Iași, Romania, is 500 years old, and the poet Mihai Eminescu
    reportedly wrote some of his best work beneath it. The comatose bees often found under lindens
    in late summer were long thought to be poisoned by the nectar, but they are more likely
    starving, with few other flowers in towns at that time.
  wildlife:
    - who: [honeybees]
      what: pollinate its strongly scented flowers
- name: Torreya californica
  common_name: California nutmeg
  native_region: California's Coast Ranges and Sierra Nevada foothills
  inaturalist_taxon_id: 55193
  description: >-
    California nutmeg is not closely related to true nutmeg. The wood is sometimes used in making Go
    game boards, as a cheaper substitute for the prized kaya (Torreya nucifera) of Japan and
    Southeast Asia.
- name: Trachycarpus fortunei
  common_name: Chinese windmill palm
  order: Arecales
  native_region: central and southern China, southern Japan, northern Myanmar and northern India
  inaturalist_taxon_id: 64323
  description: >-
    Chinese windmill palm is also called Chusan palm, after the island where Robert Fortune first
    saw it; he smuggled plants out of China to Britain in 1849, and the species is named after him.
    Its strong leaf-base fibre has been made into rope and sacks in China and Japan for thousands of
    years, so its wild range is uncertain.
- name: Tsuga canadensis
  common_name: Eastern hemlock
  order: Pinales
  native_region: >-
    eastern North America, from the Great Lakes and the Maritimes south along the Appalachians
  inaturalist_taxon_id: 48734
  description: >-
    Eastern hemlock is the state tree of Pennsylvania, and its bark was once a major source of
    tannin for tanning leather. Across much of its range it is threatened by the hemlock woolly
    adelgid, a sap-sucking insect from East Asia, and a Pacific Northwest beetle that eats the
    adelgid has been released in New York to control it.
- name: Tsuga heterophylla
  common_name: Western hemlock
  order: Pinales
  native: true
  sencoten_name: ȾKÁ¸IȽĆ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#324.
  native_region: >-
    the Pacific Northwest, from southeast Alaska to northern California and inland to Idaho and
    Montana
  inaturalist_taxon_id: 48254
  description: >-
    Western hemlock boughs are used as ritual scrubbers to protect girls at puberty and hunters
    (Kwakwaka’wakw, Hesquiaht, Ditidaht, Makah, Nlaka’pamux), and its branches are set in the sea to
    collect herring spawn. Its inner bark was eaten, and its hard knots were bent into fishhooks.
    The Ditidaht name means "fire goes out", because it burns poorly. Its seedlings grow on rotting
    stumps and logs, and wait for decades in the shade for a gap in the canopy.
  turner_pages: vol. 1, pp. 340, 344, 351; vol. 2, pp. 179, 185, 195, 303
- name: Ulmus
  common_name: Elm
  order: Rosales
  inaturalist_taxon_id: 53547
  description: This tree has only been identified to genus, not species.
- name: Ulmus americana
  common_name: American elm
  order: Rosales
  native_region: >-
    eastern North America, from Nova Scotia west to Alberta and south to Florida and Texas
  inaturalist_taxon_id: 53547
  description: >-
    American elm lined the streets of towns across the United States in the 1800s and early 1900s,
    until Dutch elm disease devastated it from the 1920s. It still thrives where the disease hasn't
    reached, notably in British Columbia, and Winnipeg's close to 200,000 elms are believed to be
    the largest surviving urban elm forest in North America.
  cultivars:
    - name: Brandon
      description: A vase-shaped American elm selected in Brandon, Manitoba.
- name: Ulmus carpinifolia
  common_name: Field elm
  order: Rosales
  native_region: southern Europe, Turkey and Iran
  inaturalist_taxon_id: 464260
  description: >-
    Field elm is the most variable of the European elms, and botanists still disagree on how to divide
    it. Dutch elm disease killed most mature elms in Europe and eastern North America in the 20th
    century, but British Columbia has so far been free of it.
- name: Ulmus glabra
  common_name: Wych elm
  order: Rosales
  native_region: Europe, from Ireland to the Ural Mountains, and western Asia as far as Iran
  inaturalist_taxon_id: 170056
  description: >-
    Wych elm's name comes from the Old English wice, "pliant" or "supple", the root also of wicker
    and weak. It is the only elm certainly native to Britain, and in E. M. Forster's novel Howards
    End a wych elm with pigs' teeth driven into its trunk, whose bark was said to cure toothache,
    stands over the house of the title.
- name: Ulmus procera
  common_name: English elm
  order: Rosales
  garden_origin: an ancient clone of the field elm, thought to come from Atina, in central Italy
  inaturalist_taxon_id: 79461
  description: >-
    English elm is not native to England: every English elm is genetically identical, and the clone
    is thought to be the Atinian elm that the Romans grew to support vines and probably brought to
    Britain. Its flowers are sterile, so it spreads only by root suckers, and its rot-resistant
    trunks were once hollowed out for water pipes.
- name: Ulmus pumila
  common_name: Siberian elm
  native_region: Central Asia, Siberia, Mongolia, Tibet, northern China and Korea
  inaturalist_taxon_id: 79463
  description: >-
    Siberian elm's unripe seeds have long been eaten in Manchuria, and during the Great Chinese
    Famine they became one of the most important foods around Harbin. Tough enough for drought,
    severe cold and poor soil, it has become invasive in North America from central Mexico to
    Ontario, and crosses in the wild with the native slippery elm.
- name: Umbellularia californica
  common_name: California bay
  order: Laurales
  native_region: the coast and foothills of California and southwestern Oregon
  inaturalist_taxon_id: 48807
  description: >-
    California bay, also called headache tree, has leaves that smell sharply of camphor when
    crushed; the Pomo and Yuki peoples treated headaches by placing a single leaf in the nostril. In
    Oregon its wood is sold as myrtlewood, and in 1933 the town of North Bend paid its workers with
    myrtlewood coins that remain legal tender there.
  wildlife:
    - who: [deer]
      what: browse its fresh sprouts
- name: Unknown
  common_name: Unknown
  inaturalist_taxon_id: 223548
- name: Viburnum plicatum
  common_name: Viburnum
  order: Dipsacales
  inaturalist_taxon_id: 170203
- name: Wildlife snag
  common_name: Wildlife snag
  description: >-
    A wildlife snag is a dead or dying tree left standing, often without its top or smaller
    branches. Foresters call snags "wildlife trees": in temperate forests they are vital habitat for
    more than 100 species of birds and mammals, and their decaying wood feeds fungi and insects.
    Most snag-dwelling animals eat insects, helping to keep forest pests in check.
  wildlife:
    - who: [woodpeckers]
      what: dig nest holes in it that more than 80 other species later use
    - who: [bats]
      what: shelter in its cavities and hollows
- name: Zelkova serrata
  common_name: Japanese zelkova
  order: Rosales
  native_region: Japan, Korea, eastern China and Taiwan
  inaturalist_taxon_id: 129055
  cultivars:
    - name: Green Vase
      description: >-
        A fast-growing, vase-shaped Japanese zelkova, often planted in place of American elm since it
        resists Dutch elm disease.
  description: >-
    Japanese zelkova, keyaki in Japanese, is a relative of the elms. In Japan its strong, handsome
    timber is used for temple buildings, furniture and taiko drums, and it's a classic bonsai tree. It
    resists Dutch elm disease, so it's often planted in place of American elm.