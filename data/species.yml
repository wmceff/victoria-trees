- name: Cupressus nootkatensis
  common_name: Yellow-cedar
  native: true
  native_region: coastal regions of northwestern North America
  sencoten_name: POŚELEḰ
  sencoten_url: http://saanich.montler.net/WordList/plants.html#322.
  inaturalist_taxon_id: 126792
  description: >-
    The specific epithet "nootkatensis" is derived from its discovery by Europeans on the lands of a
    First Nation of Canada, those lands of the Nuu-chah-nulth people of Vancouver Island, British
    Columbia, who were formerly referred to as the Nootka.


    The Nootka cypress is used extensively by the indigenous peoples of the Pacific Northwest Coast,
    along with another cypress, Thuja plicata (western red cedar). While western red cedar was
    preferred for larger projects (houses, canoes), Nootka cypress was used for smaller carvings
    such as vessels and utensils. Boughs are used in sweat bath, as scrubbers, for rheumatism,
    arthritis, and protection (Kwakwaka’wakw) (Boas 1930; Turner and Bell 1973). Used for bows,
    canoe paddles, carving. Inner bark used for baskets, mats, clothing, blankets. Bark harvested
    for weaving material; only partially harvested so as not to kill tree (widely, Northwest Coast).


    This species has been considered to be one of the finest timber trees in the world and has been
    exported to China during the last century. The wood has been used for flooring, interior finish
    and shipbuilding.
  indigenous_uses: >-
    The Nootka cypress is used extensively by the indigenous peoples of the Pacific Northwest Coast,
    along with another cypress, Thuja plicata (western red cedar). While western red cedar was
    preferred for larger projects (houses, canoes), Nootka cypress was used for smaller carvings
    such as vessels and utensils.
